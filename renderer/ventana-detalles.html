<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalles del Examen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 30px 20px;
    }
    .detalles-container {
      background: #ffffff;
      border-radius: 16px;
      padding: 35px 40px 30px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(26, 35, 50, 0.15);
      border-top: 5px solid #2c6e9c;
      margin-top: 10px;
    }
    
    /* HEADER CON LOGO */
    .detalles-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
      border-bottom: 2px solid #e8edf3;
      padding-bottom: 20px;
      flex-wrap: wrap;
    }
    .detalles-header .logo-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .detalles-header .logo-area img {
  width: 120px;
  height: 70px;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(44,110,156,0.15);
}
.detalles-header .logo-area .logo-fallback {
  width: 120px;
  height: 70px;
  background: linear-gradient(135deg, #2c6e9c, #1a4b6e);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 1px;
  box-shadow: 0 2px 12px rgba(44,110,156,0.15);
}
    .detalles-header .titulo-area h2 {
      color: #1a2332;
      font-weight: 400;
      font-size: 24px;
      letter-spacing: 0.5px;
    }
    .detalles-header .titulo-area p {
      color: #6a7a8a;
      font-size: 13px;
      margin-top: 2px;
    }

    /* SECCIONES */
    .seccion {
      margin-bottom: 25px;
    }
    .seccion h3 {
      color: #1a2332;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eef2f6;
      letter-spacing: 0.3px;
    }
    .seccion h3 .badge {
      font-size: 11px;
      font-weight: 400;
      color: #6a7a8a;
      margin-left: 8px;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 30px;
    }
    .grid-3col {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px 20px;
    }

    .campo {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f5f7fa;
    }
    .campo .label {
      color: #5a6a7a;
      font-weight: 500;
      font-size: 13px;
    }
    .campo .valor {
      color: #1a2332;
      font-weight: 600;
      font-size: 13px;
      text-align: right;
      max-width: 55%;
      word-break: break-word;
    }
    .campo .valor.destacado {
      color: #2c6e9c;
      font-size: 14px;
    }
    .campo .valor.sin-dato {
      color: #aab8c5;
      font-weight: 400;
      font-style: italic;
    }

    .tabla-frecuencias {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 5px;
    }
    .tabla-frecuencias th {
      background: #f1f5f9;
      color: #1a2332;
      font-weight: 600;
      padding: 8px 10px;
      text-align: center;
      border: 1px solid #e2e8f0;
      font-size: 11px;
    }
    .tabla-frecuencias td {
      padding: 7px 10px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .tabla-frecuencias .fila-label {
      font-weight: 600;
      background: #f8fafc;
      color: #1a2332;
    }
    .tabla-frecuencias .sin-dato-tabla {
      color: #aab8c5;
      font-style: italic;
    }

    .btn-cerrar-detalles {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: #2c6e9c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
    }
    .btn-cerrar-detalles:hover {
      background: #1a4b6e;
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(44, 110, 156, 0.3);
    }

    .sin-datos {
      text-align: center;
      color: #8a9aa8;
      padding: 30px 0;
      font-style: italic;
    }

    @media (max-width: 700px) {
      .grid-2col, .grid-3col {
        grid-template-columns: 1fr;
      }
      .detalles-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="detalles-container">
    <!-- HEADER CON LOGO -->
    <div class="detalles-header">
      <div class="logo-area">
        <img src="../img/lomodal.png" alt="Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'logo-fallback\'>SU</div>'">
        <div class="titulo-area">
          <h2>Detalles del Estudio Audiológico</h2>
          <p>Información completa del examen realizado</p>
        </div>
      </div>
    </div>

    <!-- CONTENIDO DINÁMICO -->
    <div id="contenido-detalles">
      <div class="sin-datos">Cargando información...</div>
    </div>

    <button class="btn-cerrar-detalles" onclick="window.close()">Cerrar</button>
  </div>

  <script>
    window.api.onCargarDetalles((datos) => {
      const contenedor = document.getElementById('contenido-detalles');
      
      if (!datos || !datos.paciente) {
        contenedor.innerHTML = `<div class="sin-datos">No hay datos disponibles</div>`;
        return;
      }

      // --- FUNCIÓN PARA FORMATEAR VALORES ---
      function formatearValor(valor) {
        if (valor === null || valor === undefined || valor === '') {
          return '<span class="sin-dato">--</span>';
        }
        return valor;
      }

      // --- FUNCIÓN PARA MOSTRAR FRECUENCIAS ---
      function renderizarFrecuencias(valores, titulo) {
        if (!valores || Object.keys(valores).length === 0) {
          return `<div style="color:#8a9aa8; font-style:italic; padding:8px 0;">No hay datos de ${titulo}</div>`;
        }

        const freqs = ['250', '500', '750', '1000', '1500', '2000', '3000', '4000', '6000', '8000'];
        let html = `<table class="tabla-frecuencias">
          <thead>
            <tr>
              <th>Frecuencia (Hz)</th>
              <th>${titulo} OD</th>
              <th>${titulo} OI</th>
            </tr>
          </thead>
          <tbody>`;

        freqs.forEach(freq => {
          const valOD = valores.od && valores.od[freq] !== undefined ? valores.od[freq] : null;
          const valOI = valores.oi && valores.oi[freq] !== undefined ? valores.oi[freq] : null;
          html += `<tr>
            <td class="fila-label">${freq}</td>
            <td>${formatearValor(valOD)}</td>
            <td>${formatearValor(valOI)}</td>
          </tr>`;
        });

        html += `</tbody></table>`;
        return html;
      }

      // --- CONSTRUIR HTML ---
      let html = '';

      // 1. INFORMACIÓN GENERAL
      html += `
        <div class="seccion">
          <h3>Información General</h3>
          <div class="grid-2col">
            <div class="campo"><span class="label">Paciente</span><span class="valor destacado">${datos.paciente || 'No especificado'}</span></div>
            <div class="campo"><span class="label">Documento</span><span class="valor">${datos.documento || 'No especificado'}</span></div>
            <div class="campo"><span class="label">Fecha Examen</span><span class="valor">${datos.fecha || 'No especificada'}</span></div>
            <div class="campo"><span class="label">Entidad</span><span class="valor">${datos.entidad || 'Particular'}</span></div>
            <div class="campo"><span class="label">Tipo Examen</span><span class="valor destacado">${datos.tipo_examen || 'No especificado'}</span></div>
            <div class="campo"><span class="label">Cita ID</span><span class="valor">${datos.cita_id || 'No disponible'}</span></div>
          </div>
        </div>
      `;

      // 2. AUDIOMETRÍA (si existe)
      if (datos.audiometria) {
        const aud = datos.audiometria;
        html += `
          <div class="seccion">
            <h3>Audiometría Tonal <span class="badge">(Valores en dB HL)</span></h3>
            
            <div style="margin-bottom:12px;">
              <div class="grid-2col">
                <div class="campo"><span class="label">Diagnóstico OD</span><span class="valor">${formatearValor(aud.diagnostico_od)}</span></div>
                <div class="campo"><span class="label">Diagnóstico OI</span><span class="valor">${formatearValor(aud.diagnostico_oi)}</span></div>
                <div class="campo"><span class="label">Otoscopia</span><span class="valor">${formatearValor(aud.otoscopia)}</span></div>
                <div class="campo"><span class="label">Observaciones</span><span class="valor">${formatearValor(aud.observaciones)}</span></div>
              </div>
            </div>

            <div style="margin-bottom:10px;">
              <h4 style="font-size:14px; font-weight:500; color:#3a4a5a; margin-bottom:8px;">Vía Aérea</h4>
              ${renderizarFrecuencias(aud.via_aerea || aud.valores_od || {}, 'Vía Aérea')}
            </div>

            <div>
              <h4 style="font-size:14px; font-weight:500; color:#3a4a5a; margin-bottom:8px;">Vía Ósea</h4>
              ${renderizarFrecuencias(aud.via_osea || {}, 'Vía Ósea')}
            </div>

            <div style="margin-top:12px;">
              <div class="grid-3col">
                <div class="campo"><span class="label">PTA OD (Aérea)</span><span class="valor">${formatearValor(aud.pta_od_air)}</span></div>
                <div class="campo"><span class="label">PTA OI (Aérea)</span><span class="valor">${formatearValor(aud.pta_oi_air)}</span></div>
                <div class="campo"><span class="label">PTA OD (Ósea)</span><span class="valor">${formatearValor(aud.pta_od_bone)}</span></div>
                <div class="campo"><span class="label">PTA OI (Ósea)</span><span class="valor">${formatearValor(aud.pta_oi_bone)}</span></div>
              </div>
            </div>
          </div>
        `;
      }

      // 3. LOGOAUDIOMETRÍA (si existe)
      if (datos.logoaudiometria) {
        const log = datos.logoaudiometria;
        html += `
          <div class="seccion">
            <h3>Logoaudiometría <span class="badge">(Porcentajes)</span></h3>
            
            <div style="margin-bottom:12px;">
              <div class="grid-2col">
                <div class="campo"><span class="label">Diagnóstico</span><span class="valor">${formatearValor(log.diagnostico)}</span></div>
                <div class="campo"><span class="label">Diagnóstico OD</span><span class="valor">${formatearValor(log.diagnostico_od)}</span></div>
                <div class="campo"><span class="label">Diagnóstico OI</span><span class="valor">${formatearValor(log.diagnostico_oi)}</span></div>
              </div>
            </div>

            <div style="margin-bottom:10px;">
              <h4 style="font-size:14px; font-weight:500; color:#3a4a5a; margin-bottom:8px;">Valores por Oído</h4>
              <div class="grid-2col">
                <div>
                  <p style="font-weight:600; color:#1a2332; font-size:13px; margin-bottom:4px;">OD (Oído Derecho)</p>
                  <div class="campo"><span class="label">Umbral de Voz</span><span class="valor">${formatearValor(log.urv_od)}</span></div>
                  <div class="campo"><span class="label">Umbral de Palabra</span><span class="valor">${formatearValor(log.upalabra_od)}</span></div>
                  <div class="campo"><span class="label">Umbral de  Discriminacion</span><span class="valor">${formatearValor(log.udisc_od)}</span></div>
                  <div class="campo"><span class="label">P Max</span><span class="valor">${formatearValor(log.pmax_od)}</span></div>
                </div>
                <div>
                  <p style="font-weight:600; color:#1a2332; font-size:13px; margin-bottom:4px;">OI (Oído Izquierdo)</p>
                  <div class="campo"><span class="label">Umbral de Voz</span><span class="valor">${formatearValor(log.urv_oi)}</span></div>
                  <div class="campo"><span class="label">Umbral de Palabra</span><span class="valor">${formatearValor(log.upalabra_oi)}</span></div>
                  <div class="campo"><span class="label">Umbral Discriminacion</span><span class="valor">${formatearValor(log.udisc_oi)}</span></div>
                  <div class="campo"><span class="label">P Max</span><span class="valor">${formatearValor(log.pmax_oi)}</span></div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 4. OBSERVACIONES FINALES
      html += `
        <div class="seccion">
          <h3>Observaciones Generales</h3>
          <div style="padding:10px 0; color:#1a2332; font-size:14px; background:#f8fafc; border-radius:8px; padding:12px 16px;">
            ${datos.observaciones || 'Sin observaciones registradas'}
          </div>
        </div>
      `;

      contenedor.innerHTML = html;
    });
  </script>
</body>
</html>
