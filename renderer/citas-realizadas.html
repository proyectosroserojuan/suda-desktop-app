    }

    .main-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .main-header h1 {

    .panel-header h3 {

      font-weight: 700;

    }

    .filtros {

      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filtro-group {
      flex: 1;

    .filtro-group label {
      font-size: 0.7rem;

      display: block;

    }

    .filtro-group input,

      width: 100%;

    .search-box {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .search-box input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.85rem;

    .btn-search {

      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;

    }

    .tabla-container {
      overflow-x: auto;
      padding: 0 20px 20px 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    th, td {
      padding: 10px 8px;
      text-align: left;

    th {

    .badge {

    .paginador {

<body>

</div>

<div class="main-header">
  <h1>📋 CITAS REALIZADAS</h1>

</div>

<!-- Botones de navegación -->
<div class="nav-buttons">
  <button class="btn-nav" id="btnCitasSemana">Citas de la Semana</button>

<div class="citas-panel">
  <div class="panel-header">
    <h3 id="panelTitle">📋 Citas Atendidas</h3>
    
    <div class="filtros">
      <div class="filtro-group">
        <label>Filtrar por fecha</label>

      </div>
      <div class="filtro-group">

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Buscar por nombre o cédula...">

  <div class="tabla-container">
    <table>
      <thead>
        <tr>
          <th>Fecha</th><th>Hora</th><th>Paciente</th><th>Documento</th><th>Entidad</th><th>Tipo Atención</th><th>Estado</th> <!--<th>Acciones</th> -->

<script>
  let todasLasCitas = [];
  let citasFiltradas = [];
  let paginaActual = 1;
  const registrosPorPagina = 10;
  let entidadesLista = [];

  function mostrarMensaje(texto, tipo) {
    const mensajeDiv = document.getElementById('mensaje');
    if (mensajeDiv) {
      mensajeDiv.textContent = texto;
      mensajeDiv.className = `mensaje ${tipo}`;
      mensajeDiv.style.display = 'block';
      setTimeout(() => {
        mensajeDiv.style.display = 'none';
      }, 3000);
    }
  }

  function formatearFecha(fechaStr) {
    if (!fechaStr) return '';
    try {
      const fecha = new Date(fechaStr);
      return fecha.toLocaleDateString('es-CO');
    } catch (e) {
      return fechaStr;
    }
  }

  function formatearHora(horaStr) {
    if (!horaStr) return '';
    try {
      let horas, minutos;
      if (horaStr.includes(':')) {
        const partes = horaStr.split(':');
        horas = parseInt(partes[0]);
        minutos = partes[1];
      } else {
        return horaStr;
      }
      const periodo = horas >= 12 ? 'PM' : 'AM';
      let horas12 = horas % 12;
      horas12 = horas12 === 0 ? 12 : horas12;
      return `${horas12}:${minutos} ${periodo}`;
    } catch (e) {
      return horaStr;
    }
  }

function obtenerTipoAtencion(cita) {
  return cita.tipo_atencion || 'No especificado';
}

  async function cargarEntidades() {
    try {
      const result = await window.api.obtenerEntidades();
      if (result && result.ok) {
        entidadesLista = result.entidades;
        const filtroEntidad = document.getElementById('filtroEntidad');
        filtroEntidad.innerHTML = '<option value="">Todas</option>';
        entidadesLista.forEach(entidad => {
          const option = document.createElement('option');
          option.value = entidad.id;
          option.textContent = entidad.nombre;
          filtroEntidad.appendChild(option);
        });
      }
    } catch (error) {
      console.error('Error cargando entidades:', error);
    }
  }

  async function cargarCitas() {
    try {
      const result = await window.api.obtenerTodasLasCitas();
      if (result && result.ok) {
        todasLasCitas = result.citas;
        aplicarFiltros();
      } else {
        mostrarMensaje('Error cargando citas', 'error');
      }
    } catch (error) {
      console.error('Error:', error);
      mostrarMensaje('Error al cargar citas', 'error');
    }
  }

function aplicarFiltros() {
  const filtroFecha = document.getElementById('filtroFecha').value;
  const filtroEntidad = document.getElementById('filtroEntidad').value;
  const searchText = document.getElementById('searchInput').value.toLowerCase();

  console.log('🔍 ========== INICIO BÚSQUEDA ==========');
  console.log('📝 Texto buscado:', `"${searchText}"`);
  console.log('📏 Longitud del texto:', searchText.length);
  console.log('📅 Filtro fecha:', filtroFecha || '(vacío)');
  console.log('🏢 Filtro entidad:', filtroEntidad || '(vacío)');
  console.log('📊 Total citas en memoria:', todasLasCitas.length);
  
  // Mostrar TODOS los datos de las primeras 2 citas para ver qué campos tienen
  if (todasLasCitas.length > 0) {
    console.log('\n📋 EJEMPLO DE DATOS DE CITAS:');
    todasLasCitas.slice(0, 2).forEach((cita, idx) => {
      console.log(`\n--- Cita ${idx + 1} (ID: ${cita.id}) ---`);
      console.log(`  estado: "${cita.estado}"`);
      console.log(`  paciente_nombre: "${cita.paciente_nombre}" (tipo: ${typeof cita.paciente_nombre})`);
      console.log(`  documento: "${cita.documento}" (tipo: ${typeof cita.documento})`);
      console.log(`  fecha_cita:`, cita.fecha_cita);
      console.log(`  entidad_id: ${cita.entidad_id}`);
    });
  }

  // CONTAR cuántas tienen estado 'atendida'
  const citasAtendidasCount = todasLasCitas.filter(c => c.estado === 'atendida').length;
  console.log(`\n✅ Citas con estado "atendida": ${citasAtendidasCount} de ${todasLasCitas.length}`);

  // Aplicar filtros con logs detallados
  citasFiltradas = todasLasCitas.filter(cita => {
    // Verificar estado
    if (cita.estado !== 'atendida') {
      return false;
    }
    
    // FILTRO DE FECHA
    if (filtroFecha) {
      let fechaCitaStr;
      if (cita.fecha_cita instanceof Date) {
        const year = cita.fecha_cita.getFullYear();
        const month = String(cita.fecha_cita.getMonth() + 1).padStart(2, '0');
        const day = String(cita.fecha_cita.getDate()).padStart(2, '0');
        fechaCitaStr = `${year}-${month}-${day}`;
      } else if (typeof cita.fecha_cita === 'string') {
        fechaCitaStr = cita.fecha_cita.split('T')[0];
      } else {
        fechaCitaStr = new Date(cita.fecha_cita).toISOString().split('T')[0];
      }
      if (fechaCitaStr !== filtroFecha) return false;
    }
    
    // FILTRO DE ENTIDAD
    if (filtroEntidad) {
      const citaEntidadId = parseInt(cita.entidad_id);
      const filtroEntidadNum = parseInt(filtroEntidad);
      if (citaEntidadId !== filtroEntidadNum) return false;
    }
    
    // FILTRO DE BÚSQUEDA CON LOGS DETALLADOS
    if (searchText && searchText.length > 0) {
      // Obtener valores asegurando que sean strings
      const nombreCompleto = cita.paciente_nombre ? String(cita.paciente_nombre) : '';
      const documentoStr = cita.documento ? String(cita.documento) : '';
      
      const nombreLower = nombreCompleto.toLowerCase();
      const documentoLower = documentoStr.toLowerCase();
      
      const nombreMatch = nombreLower.includes(searchText);
      const docMatch = documentoLower.includes(searchText);
      
      // Log detallado de la búsqueda (solo cuando hay texto)
      console.log(`\n🔎 Analizando cita ID ${cita.id}:`);
      console.log(`   Nombre: "${nombreCompleto}" → contiene "${searchText}": ${nombreMatch}`);
      console.log(`   Documento: "${documentoStr}" → contiene "${searchText}": ${docMatch}`);
      console.log(`   Resultado: ${nombreMatch || docMatch ? '✅ PASA' : '❌ RECHAZADA'}`);
      
      if (!nombreMatch && !docMatch) return false;
    }
    
    return true;
  });

  console.log(`\n📊 RESULTADO FINAL: ${citasFiltradas.length} citas filtradas`);
  
  if (searchText && searchText.length > 0) {
    if (citasFiltradas.length === 0) {
      console.log('⚠️ NO SE ENCONTRARON COINCIDENCIAS');
      console.log('Posibles causas:');
      console.log('  1. Los nombres/cédulas no coinciden exactamente');
      console.log('  2. Hay espacios extras en los datos');
      console.log('  3. Hay mayúsculas/minúsculas (aunque se convierte a minúsculas)');
    } else {
      console.log('✅ CITAS QUE COINCIDEN:');
      citasFiltradas.forEach(cita => {
        console.log(`   - ID:${cita.id} | ${cita.paciente_nombre} | ${cita.documento}`);
      });
    }
  }
  
  console.log('🔍 ========== FIN BÚSQUEDA ==========\n');
  
  paginaActual = 1;
  renderizarTabla();
  renderizarPaginador();
}
  function renderizarTabla() {
  const tbody = document.getElementById('tablaCitasBody');
  const inicio = (paginaActual - 1) * registrosPorPagina;
  const fin = inicio + registrosPorPagina;
  const citasPagina = citasFiltradas.slice(inicio, fin);

  if (citasPagina.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8">No hay citas realizadas registradas</td></tr>';
    return;
  }

  tbody.innerHTML = citasPagina.map(cita => {
    const fechaFormateada = formatearFecha(cita.fecha_cita);
    const horaFormateada = formatearHora(cita.hora_cita);
    const tipoAtencion = obtenerTipoAtencion(cita);
    
    // Escapar datos para evitar problemas con comillas
    const citaJSON = JSON.stringify(cita).replace(/'/g, "&#39;");
    
    return `
      <tr>
        <td>${fechaFormateada || ''}</td>
        <td>${horaFormateada || ''}</td>
        <td><strong>${cita.paciente_nombre || ''}</strong></td>
        <td>${cita.documento || ''}</td>
        <td>${cita.entidad_nombre || ''}</td>
        <td>${tipoAtencion}</td>
        <td><span class="badge badge-atendida">Realizada</span></td>
        <td>




        </td>
      </tr>
    `;
  }).join('');
}

  function renderizarPaginador() {
    const totalPaginas = Math.ceil(citasFiltradas.length / registrosPorPagina);
    const paginadorDiv = document.getElementById('paginador');
    
    if (totalPaginas <= 1) {
      paginadorDiv.innerHTML = '';
      return;
    }

    let html = `<button onclick="cambiarPagina(1)" ${paginaActual === 1 ? 'disabled' : ''}>«</button>`;
    html += `<button onclick="cambiarPagina(${paginaActual - 1})" ${paginaActual === 1 ? 'disabled' : ''}>‹</button>`;
    
    for (let i = 1; i <= totalPaginas; i++) {
      if (i === 1 || i === totalPaginas || (i >= paginaActual - 2 && i <= paginaActual + 2)) {
        html += `<button onclick="cambiarPagina(${i})" class="${paginaActual === i ? 'active' : ''}">${i}</button>`;
      } else if (i === paginaActual - 3 || i === paginaActual + 3) {
        html += `<button disabled>...</button>`;
      }
    }
    
    html += `<button onclick="cambiarPagina(${paginaActual + 1})" ${paginaActual === totalPaginas ? 'disabled' : ''}>›</button>`;
    html += `<button onclick="cambiarPagina(${totalPaginas})" ${paginaActual === totalPaginas ? 'disabled' : ''}>»</button>`;
    
    paginadorDiv.innerHTML = html;
  }

  window.cambiarPagina = function(pagina) {
    paginaActual = pagina;
    renderizarTabla();
    renderizarPaginador();
  };

  // Navegación entre vistas
  document.getElementById('btnCitasSemana')?.addEventListener('click', () => {
    window.api?.navegar('citassemana.html');
  });

  document.getElementById('btnCitasRealizadas')?.addEventListener('click', () => {
    // Ya estamos en esta vista
  });

  document.getElementById('btnCitasPendientesNoSemana')?.addEventListener('click', () => {
    window.api?.navegar('citas-pendientes.html');
  });

  // Event listeners para filtros
 document.getElementById('btnLimpiarBusqueda')?.addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('filtroFecha').value = '';  // ← Limpia fecha
  document.getElementById('filtroEntidad').value = ''; // ← Limpia entidad
  aplicarFiltros(); // ← Aplica los filtros limpios
});
  document.getElementById('searchInput')?.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') aplicarFiltros();
  });

  document.getElementById('filtroFecha')?.addEventListener('change', aplicarFiltros);
document.getElementById('filtroEntidad')?.addEventListener('change', aplicarFiltros);
document.getElementById('btnBuscar')?.addEventListener('click', aplicarFiltros);

  // Botón volver
  document.getElementById('btnVolverDashboard')?.addEventListener('click', () => {
    window.api?.volverDashboard();
  });

  // Inicializar
  async function init() {
    await cargarEntidades();
    await cargarCitas();
  }

  // Función para determinar el tipo de certificado
function determinarTipoCertificado(tipoAtencion) {
  const mapa = {
    'Audiometría': 'audiometria',
    'Logoaudiometria': 'logoaudiometria',
    'Audiometria Tonal y Logoadiometria': 'combinado',
    'Prepagada Audiometria Tonal': 'audiometria',
    'Prepagada Logoaudiometria': 'logoaudiometria',
    'Prepagada Audiometria Tonal y Logoadiometria': 'combinado',
    'Cuadro Clinico Auditivo': 'combinado'
  };
  return mapa[tipoAtencion] || 'audiometria';
}
// Función para generar PDF desde una cita realizada

        let valoresOD = {};
        let valoresOI = {};
        
        // Verificar dónde están los valores
        if (examenData.urv_od !== undefined) {

// Función para generar QR desde una cita realizada
async function generarQRcita(cita) {
  try {
    const buttons = document.querySelectorAll('.btn-qr');
    let targetBtn = null;
    for (let btn of buttons) {
      if (btn.textContent.includes('QR') && btn.closest('tr')?.innerHTML.includes(cita.id)) {
        targetBtn = btn;
        break;
      }
    }
    
    if (targetBtn) {
      targetBtn.textContent = '⏳...';
      targetBtn.disabled = true;
    }
    
    const tipoCertificado = determinarTipoCertificado(cita.tipo_atencion);

    
    
    // Buscar examen por cita_id
    let examenData = null;
    if (window.api && window.api.obtenerExamenPorCitaId) {
      const result = await window.api.obtenerExamenPorCitaId(cita.id);
      if (result.ok && result.examen) {
        examenData = result.examen;
        console.log('✅ Examen encontrado para QR:', examenData);
      }
    }
    
    // Preparar datos para el QR (debe tener los mismos datos que el PDF)
    let datosParaQR = null;
    
    if (examenData) {
      if (examenData.tipo_examen === 'logoaudiometria') {
        datosParaQR = {
          paciente: {
            nombre: cita.paciente_nombre,
            documento: cita.documento
          },
          fecha_cita: cita.fecha_cita,
          valores_od: {
            urv: examenData.urv_od || '',
            upalabra: examenData.upalabra_od || '',
            udisc: examenData.udisc_od || '',
            pmax: examenData.pmax_od || ''
          },
          valores_oi: {
            urv: examenData.urv_oi || '',
            upalabra: examenData.upalabra_oi || '',
            udisc: examenData.udisc_oi || '',
            pmax: examenData.pmax_oi || ''
          },
          grafica_base64: examenData.grafica_base64 || '',
          diagnostico: examenData.diagnostico || '',
          diagnostico_od: examenData.diagnostico_od || '',
          diagnostico_oi: examenData.diagnostico_oi || ''
        };
      } else {
        let valoresOD = {};
        let valoresOI = {};
        
        try {
          if (examenData.valores_od) {
            valoresOD = typeof examenData.valores_od === 'string' 
              ? JSON.parse(examenData.valores_od) 
              : examenData.valores_od;
          }
          if (examenData.valores_oi) {
            valoresOI = typeof examenData.valores_oi === 'string' 
              ? JSON.parse(examenData.valores_oi) 
              : examenData.valores_oi;
          }
        } catch(e) {}
        
        datosParaQR = {
          paciente: {
            nombre: cita.paciente_nombre,
            documento: cita.documento
          },
          fecha_cita: cita.fecha_cita,
          valores_od: valoresOD,
          valores_oi: valoresOI,
          grafica_base64: examenData.grafica_base64 || '',
          diagnostico_od: examenData.diagnostico_od || '',
          diagnostico_oi: examenData.diagnostico_oi || '',
          observaciones: examenData.observaciones || ''
        };
      }
    } else {
      datosParaQR = {
        paciente: {
          nombre: cita.paciente_nombre,
          documento: cita.documento
        },
        fecha_cita: cita.fecha_cita,
        valores_od: {},
        valores_oi: {},
        grafica_base64: '',
        diagnostico: '',
        diagnostico_od: '',
        diagnostico_oi: ''
      };
    }
    
    // Datos para mostrar en la ventana del QR
    const datosCita = {
      paciente: {
        nombre: cita.paciente_nombre,
        documento: cita.documento
      },
      fecha_cita: cita.fecha_cita,
      entidad: cita.entidad_nombre
    };
    
    console.log('Enviando a QR - grafica_base64 existe?', !!datosParaQR.grafica_base64);
    
    const result = await window.api.generarYMostrarQR(
      datosCita,
      datosParaQR,  // ← Pasar los datos completos del examen
      cita.entidad_nombre || 'No especificada',
      tipoCertificado
    );
    
    if (!result.ok) {
      mostrarMensaje('Error al generar QR: ' + (result.error || 'Desconocido'), 'error');
    }
    
    if (targetBtn) {
      targetBtn.textContent = '📱 QR';
      targetBtn.disabled = false;
    }
    
  } catch (error) {
    console.error('Error generando QR:', error);
    mostrarMensaje('Error al generar el código QR', 'error');
    
    const buttons = document.querySelectorAll('.btn-qr');
    for (let btn of buttons) {
      if (btn.textContent.includes('...')) {
        btn.textContent = '📱 QR';
        btn.disabled = false;
      }
    }
  }
  
}
