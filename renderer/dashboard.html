<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Clínica Audiométrica</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
      background: #ffffff;
      height: 100vh;
      overflow: hidden;
    }

    /* CONTENEDOR PRINCIPAL */
    .dashboard-container {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 270px;
      background: linear-gradient(135deg, #0e469b 0%, #1a3a6a, #062455 50%, #ffffff 100%);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15);
      border-right: 3px solid #e0eaf7; /* Verde menta */
    }

    /* LOGO EN SIDEBAR */
    .sidebar-logo {
      text-align: center;
      margin-bottom: 32px;
      padding-bottom: 22px;
      border-bottom: 2px solid #e0eaf7; /* Verde menta */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sidebar-logo img {
      max-width: 130px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      border: 3px solid #e0eaf7; /* Borde verde menta */
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      margin-bottom: 15px;
      background: white;
      padding: 6px;
    }

    .sidebar-logo img:hover {
      transform: scale(1.04);
      box-shadow: 0 10px 30px rgba(26, 188, 156, 0.3);
    }

    .sidebar-logo h2 {
      font-size: 1.3rem;
      color: #ffffff;
      margin-top: 6px;
      letter-spacing: 1px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .sidebar-logo span {
      font-size: 0.75rem;
      color: #ffffff; /* Azul claro */
      display: block;
      font-weight: 300;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(26, 188, 156, 0.15);
      padding: 4px 14px;
      border-radius: 30px;
      margin-top: 5px;
      border: 1px solid rgba(26, 188, 156, 0.2);
    }

    /* NAVEGACIÓN */
    .sidebar nav {
      flex: 1;
      margin-top: 8px;
    }

    .sidebar nav button {
      width: 100%;
      padding: 13px 18px;
      margin-bottom: 8px;
      background: transparent;
      border: none;
      border-radius: 10px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff; /* Azul claro */
      transition: all 0.25s ease;
      border-left: 3px solid transparent;
      letter-spacing: 0.3px;
    }

    .sidebar nav button:hover {
      background: rgba(26, 188, 156, 0.12);
      color: #ffffff;
      border-left-color: #1abc9c;
      transform: translateX(4px);
    }

    .sidebar nav button.active {
      background: rgba(26, 188, 156, 0.18);
      color: #ffffff;
      border-left-color: #ffffff;
      font-weight: 600;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* scrollbar sidebar */
    .sidebar::-webkit-scrollbar {
      width: 5px;
    }
    .sidebar::-webkit-scrollbar-track {
      background: #0a1a2f;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: #1abc9c;
      border-radius: 10px;
    }

    /* CONTENIDO */
    .content {
      flex: 1;
      padding: 28px 35px;
      overflow-y: auto;
      background: #ffffff;
    }

    /* USER INFO */
    .user-info {
      background: #ffffff;
      padding: 14px 28px;
      border-radius: 16px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(10, 26, 47, 0.08);
      border: 1px solid #dce6f0;
      border-left: 5px solid #e0eaf7;
    }

    .user-info .user-details {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      background: #0a1a2f; /* Azul oscuro */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 19px;
      border: 2px solid #1abc9c;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .user-info span {
      color: #1f2a3a;
      font-size: 15px;
    }

    .user-info .rol {
      font-weight: 600;
      color: #0a1a2f;
      background: #c8e6e0; /* Verde menta claro */
      padding: 5px 14px;
      border-radius: 30px;
      font-size: 12px;
      letter-spacing: 0.4px;
      border: 1px solid #1abc9c;
    }

    .logout-btn {
      background: #750000;
      color: white;
      border: 1px solid #ffffff;
      padding: 9px 22px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
    }

    .logout-btn:hover {
      background: #ffffff;
      color: #0a1a2f;
      box-shadow: 0 4px 12px rgba(26, 188, 156, 0.3);
      transform: scale(1.02);
    }

    /* TÍTULOS */
    .content h1 {
      margin-top: 0;
      margin-bottom: 6px;
      color: #0a1a2f;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      position: relative;
      display: inline-block;
    }

    .content h1::after {
      content: '';
      display: block;
      width: 60px;
      height: 4px;
      background: #1abc9c;
      margin-top: 6px;
      border-radius: 4px;
    }

    .subtitle {
      margin-bottom: 30px;
      font-size: 15px;
      color: #3a4a5e;
      font-weight: 400;
      background: rgba(26, 188, 156, 0.06);
      padding: 10px 18px;
      border-radius: 30px;
      display: inline-block;
      border: 1px solid rgba(26, 188, 156, 0.15);
    }

    /* TARJETAS */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 24px;
    }

    .card {
      background: #ffffff;
      padding: 24px 22px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(10, 26, 47, 0.06);
      border: 1px solid #e2eaf3;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      border-bottom: 4px solid #a9aaaa;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 35px rgba(10, 26, 47, 0.12);
      border-color: #0a1a2f;
      border-bottom-color: #0a1a2f;
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #0a1a2f;
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card h3 span {
      font-size: 1.5rem;
    }

    .card p {
      font-size: 14px;
      color: #4a5a6e;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .card button {
      padding: 11px 0;
      width: 100%;
      border: none;
      border-radius: 40px;
      background: #919292;
      color: rgb(255, 255, 255);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
      box-shadow: 0 2px 8px rgba(10, 26, 47, 0.15);
    }

    .card button:hover {
      background: #1abc9c;
      color: #0a1a2f;
      box-shadow: 0 6px 18px rgba(26, 188, 156, 0.35);
      transform: scale(1.02);
    }

    /* SCROLL CONTENIDO */
    .content::-webkit-scrollbar {
      width: 7px;
    }
    .content::-webkit-scrollbar-track {
      background: #e2eaf3;
      border-radius: 10px;
    }
    .content::-webkit-scrollbar-thumb {
      background: #1abc9c;
      border-radius: 10px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .sidebar {
        width: 220px;
        padding: 18px 14px;
      }
      .sidebar-logo img {
        max-width: 100px;
      }
      .content {
        padding: 18px 16px;
      }
      .user-info {
        flex-wrap: wrap;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

<div class="dashboard-container">
  <!-- SIDEBAR CON LOGO -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../img/lomodal.png" alt="Logo U.D.A." onerror="this.style.display='none'; this.parentElement.innerHTML='<h2>🏥 Clínica Auditiva</h2><span>Especialistas en Audición</span>'">
      <h2>S.U.D.A</h2>
      <span>Sistema de Unidad Diagnostica Auditiva</span>
    </div>
    <nav id="navMenu">
      <!-- Botones dinámicos según rol -->
    </nav>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="content">
    <div class="user-info">
      <div class="user-details">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div>
          <span id="userNombre" style="font-weight: 500;"></span>
          <span class="rol" id="userRol"></span>
        </div>
      </div>
      <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <h1>Panel principal</h1>
    <p class="subtitle" id="bienvenidaMsg"></p>

    <div class="cards" id="cardsContainer">
      <!-- Tarjetas dinámicas según rol -->
    </div>
  </main>
</div>

<script>
  let usuarioActual = null;

  // Configuración de módulos por rol
  const modulosPorRol = {
    administrador: [
      { id: 'pacientes', nombre: 'Pacientes', descripcion: 'Registro y gestión de pacientes, historial clínico', archivo: 'pacientes.html', icono: '<i class="fas fa-users"></i>' },
      { id: 'citas', nombre: 'Citas', descripcion: 'Agenda y control de citas programadas', archivo: 'citas.html', icono: '	<i class="fas fa-calendar-alt"></i>' },
      { id: 'audiometria', nombre: 'Audiometrías', descripcion: 'Resultados y seguimiento clínico audiológico', archivo: 'audiometria.html', icono: '<i class="fas fa-headphones"></i>' },
      { id: 'audiometriaCompleta', nombre: 'Audiometría Tonal Completa', descripcion: 'Evaluación completa con AC, BC, UCL y logoaudiometría', archivo: 'AudiometríaTonalCompleta.html', icono: '🔊' },
      { id: 'logoaudiometria', nombre: 'Logoaudiometría', descripcion: 'Pruebas de reconocimiento de palabras', archivo: 'Logoaudiometria.html', icono: '🗣️' },
      { id: 'impedanciometria', nombre: 'Impedanciometría', descripcion: 'Estudio de la impedancia acústica', archivo: 'Inpedanciometria.html', icono: '📊' },
      { id: 'resultados', nombre: 'Resultados', descripcion: 'Consulta y gestión de resultados de citas', archivo: 'resultadoshistorialdetalles.html', icono: '📊' },
      { id: 'informes', nombre: 'Informes', descripcion: 'Generación de reportes y certificados médicos', archivo: 'informes.html', icono: '📄' },
      { id: 'configuracion', nombre: 'Configuración', descripcion: 'Configuración del sistema y usuarios', archivo: 'configuracion.html', icono: '⚙️' }
    ],
    secretaria: [
      { id: 'pacientes', nombre: 'Pacientes', descripcion: 'Registro y gestión de pacientes', archivo: 'pacientes.html', icono: '	<i class="fas fa-users"></i>' },
      { id: 'citas', nombre: 'Agenda de Citas', descripcion: 'Agenda y control de citas programadas', archivo: 'citas.html', icono: '	<i class="fas fa-calendar-alt"></i>' },
      { id: 'Reportes', nombre: 'Reportes', archivo: 'reportes.html', descripcion: '', icono: '<i class="fas fa-file-alt"></i> Informes' },
      { id: 'citaseguimiento', nombre: 'Seguimiento de citas', descripcion: '', archivo: 'realizadasvistasecretaria.html', icono: '	<i class="fas fa-calendar-alt"></i>' },
      { id: 'editaryborrar', nombre: 'Auditoria de Resultados', descripcion: '', archivo: 'modificaryborrarresultados.html', icono: '	<i class="fas fa-calendar-alt"></i>' },
    ],
    audiologo: [
      { id: 'audiometria', nombre: 'Audiometría Tonal', descripcion: '', archivo: 'AudiometriaTonal.html', icono: '<i class="fas fa-volume-up"></i>' },
     // { id: 'audiometriaCompleta', nombre: 'Audiometría Tonal Completa', descripcion: 'Evaluación completa con AC, BC, UCL', archivo: 'AudiometríaTonalCompleta.html', icono: '🔊' },
      { id: 'logoaudiometria', nombre: 'Logoaudiometría', descripcion: '', archivo: 'Logoaudiometria.html', icono: '<i class="fas fa-comment-dots"></i> ' },
       { id: 'citas', nombre: 'Agenda de Citas', descripcion: 'Agenda y control de citas programadas', archivo: 'citas.html', icono: '	<i class="fas fa-calendar-alt"></i>' },
      { id: 'resultados', nombre: 'Resultados', descripcion: '', archivo: 'resultadoshistorialdetalles.html', icono: '<i class="fas fa-file-alt"></i>' },
      { id: 'graficas', nombre: 'Reportes', descripcion: '', archivo: 'estadisticas.html', icono: '<i class="fas fa-file-alt"></i> Informes' },
    //  { id: 'impedanciometria', nombre: 'Impedanciometría', descripcion: 'Estudio de la impedancia acústica', archivo: 'Inpedanciometria.html', icono: '📊' }
    ]
  };

  // Botones del sidebar por rol
  const botonesSidebarPorRol = {
    administrador: [
      { nombre: '👥 Pacientes', archivo: 'pacientes.html' },
      { nombre: '📅 Citas', archivo: 'citas.html' },
      { nombre: '🎧 Audiometrías', archivo: 'audiometria.html' },
      { nombre: '🔊 Audiometría Tonal', archivo: 'AudiometríaTonalCompleta.html' },
      { nombre: '🗣️ Logoaudiometría', archivo: 'Logoaudiometria.html' },
      { nombre: '📊 Impedanciometría', archivo: 'Inpedanciometria.html' },
      { nombre: '📄 Informes', archivo: 'informes.html' },
      { nombre: '⚙️ Configuración', archivo: 'configuracion.html' }
    ],
    secretaria: [
      { nombre: 'Pacientes', archivo: 'pacientes.html' },
      { nombre: 'Citas', archivo: 'citas.html' }
    ],
    audiologo: [
      { nombre: 'Citas Semana', archivo: 'citassemana.html' },
      { nombre: ' Audiometría Tonal', archivo: 'AudiometriaTonal.html' },
      { nombre: ' Logoaudiometría', archivo: 'Logoaudiometria.html' },

    ]
  };

  function navegarA(destino) {
    if (window.api && window.api.navegar) {
      window.api.navegar(destino);
    } else {
      console.error('No se puede navegar: API no disponible');
      alert('Error: No se puede cambiar de página');
    }
  }

  function cerrarSesion() {
    navegarA('login.html');
  }

  function cargarSidebar(rol) {
    const navMenu = document.getElementById('navMenu');
    navMenu.innerHTML = '';
    
    const botones = botonesSidebarPorRol[rol] || [];
    
    botones.forEach(boton => {
      const btn = document.createElement('button');
      btn.textContent = boton.nombre;
      btn.onclick = () => navegarA(boton.archivo);
      navMenu.appendChild(btn);
    });
  }

  function cargarTarjetas(rol) {
    const cardsContainer = document.getElementById('cardsContainer');
    cardsContainer.innerHTML = '';
    
    const modulos = modulosPorRol[rol] || [];
    
    if (modulos.length === 0) {
      cardsContainer.innerHTML = '<p style="color: #6b7280;">No tienes módulos asignados</p>';
      return;
    }
    
    modulos.forEach(modulo => {
      const card = document.createElement('div');
      card.className = 'card';
      
      card.innerHTML = `
        <h3>${modulo.icono} ${modulo.nombre}</h3>
        <p>${modulo.descripcion}</p>
        <button>Ver módulo</button>
      `;
      
      const button = card.querySelector('button');
      button.addEventListener('click', (e) => {
        e.stopPropagation();
        navegarA(modulo.archivo);
      });
      
      card.addEventListener('click', () => {
        navegarA(modulo.archivo);
      });
      
      cardsContainer.appendChild(card);
    });
  }

  function getInitials(nombre) {
    if (!nombre) return '👤';
    const parts = nombre.split(' ');
    if (parts.length >= 2) {
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }
    return nombre.substring(0, 2).toUpperCase();
  }

  async function cargarUsuario() {
    try {
      if (window.api && window.api.getUsuarioActual) {
        usuarioActual = await window.api.getUsuarioActual();
        
        if (!usuarioActual) {
          navegarA('login.html');
          return;
        }
        
        // Mostrar información del usuario
        document.getElementById('userNombre').textContent = usuarioActual.nombre_completo;
        document.getElementById('userRol').textContent = usuarioActual.rol.toUpperCase();
        
        // Avatar con iniciales
        const avatar = document.getElementById('userAvatar');
        const iniciales = getInitials(usuarioActual.nombre_completo);
        avatar.textContent = iniciales;
        
        // Mensaje de bienvenida
        let mensaje = '';
        switch(usuarioActual.rol) {
          case 'administrador':
            mensaje = 'Bienvenido Administrador. Tienes acceso completo al sistema.';
            break;
          case 'audiologo':
            mensaje = 'Bienvenido Audiólogo. Acceso a pruebas audiológicas y citas de pacientes.';
            break;
          case 'secretaria':
            mensaje = 'Bienvenida Jeniffer. Acceso a gestión de pacientes y citas.';
            break;
          default:
            mensaje = 'Bienvenido al sistema.';
        }
        document.getElementById('bienvenidaMsg').textContent = mensaje;
        
        cargarSidebar(usuarioActual.rol);
        cargarTarjetas(usuarioActual.rol);
      } else {
        console.error('API no disponible');
      }
    } catch (error) {
      console.error('Error cargando usuario:', error);
      navegarA('login.html');
    }
  }

  // Inicializar
  cargarUsuario();
</script>

</body>
</html>
