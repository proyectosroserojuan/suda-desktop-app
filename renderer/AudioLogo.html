<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiología Clínica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../services/duplicadoService.js"></script>
    <script src="../services/ctrlGrabar.js"></script>  <!-- ← AGREGAR ESTA LÍNEA -->
    <style>
        * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
}

:root {
    --escala: 1;
}

body { 
    font-family: Arial, sans-serif; 
    background: #ffffff; 
    padding: calc(20px * var(--escala)); 
    max-width: calc(1600px * var(--escala));
    margin: 0 auto;
    font-size: calc(16px * var(--escala));
}

.header {
    background: #ffffff;
    color: rgb(0, 0, 0);
    padding: calc(15px * var(--escala)) calc(30px * var(--escala));
    border-radius: calc(12px * var(--escala));
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: calc(20px * var(--escala));
    font-size: calc(16px * var(--escala));
}

.header h1 {
    font-size: calc(20px * var(--escala));
}

.tabs {
    display: flex;
    gap: calc(10px * var(--escala));
    margin-bottom: calc(20px * var(--escala));
    flex-wrap: wrap;
}

.tab-btn {
    padding: calc(12px * var(--escala)) calc(30px * var(--escala));
    border: none;
    border-radius: calc(8px * var(--escala));
    font-weight: 600;
    cursor: pointer;
    background: #e2e8f0;
    color: #334155;
    font-size: calc(1rem * var(--escala));
}

.tab-btn.active {
    background: #0084ff;
    color: white;
}

.tab-btn.grabar {
    background: #27ae60;
    color: white;
    margin-left: auto;
}

.tab-btn.grabar:hover { 
    background: #219a52; 
}

.tab-pane {
    position: absolute;
    top: calc(180px * var(--escala));
    left: calc(20px * var(--escala));
    right: calc(20px * var(--escala));
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease;
    height: calc(800px * var(--escala));
    pointer-events: none;
}

.btn-back {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    padding: 8px 16px;
    border-radius: 30px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.75rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.btn-back:hover {
    background: rgba(255, 255, 255, 0.25);
}

.tab-pane.active {
    position: relative;
    top: auto;
    left: auto;
    right: auto;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

iframe {
    width: 100%;
    height: calc(800px * var(--escala));
    border: none;
    border-radius: calc(8px * var(--escala));
    background: white;
}

.loading-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.loading-content {
    background: white;
    padding: calc(30px * var(--escala));
    border-radius: calc(12px * var(--escala));
    text-align: center;
}

.loading-content p {
    font-size: calc(16px * var(--escala));
}

.spinner {
    border: calc(4px * var(--escala)) solid #f3f3f3;
    border-top: calc(4px * var(--escala)) solid #1e3a8a;
    border-radius: 50%;
    width: calc(40px * var(--escala));
    height: calc(40px * var(--escala));
    animation: spin 1s linear infinite;
    margin: 0 auto calc(15px * var(--escala));
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.notificacion {
    position: fixed;
    bottom: calc(20px * var(--escala));
    left: 50%;
    transform: translateX(-50%);
    padding: calc(15px * var(--escala)) calc(30px * var(--escala));
    border-radius: calc(8px * var(--escala));
    color: white;
    font-weight: bold;
    z-index: 10001;
    animation: fadeInOut 3s ease forwards;
    font-size: calc(14px * var(--escala));
}

.notificacion.exito { background: #27ae60; }
.notificacion.error { background: #e74c3c; }

@keyframes fadeInOut {
    0% { opacity: 0; transform: translateX(-50%) translateY(calc(20px * var(--escala))); }
    15% { opacity: 1; transform: translateX(-50%) translateY(0); }
    85% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(calc(-20px * var(--escala))); }
}

/* Estilos para el modal de resultados */
#modalResultados button:hover {
    transform: translateY(calc(-2px * var(--escala)));
    box-shadow: 0 calc(6px * var(--escala)) calc(20px * var(--escala)) rgba(0,0,0,0.15);
}
#modalResultados button:active {
    transform: translateY(0px);
}
#btnVerResultado:hover { background: #1a4b6e; }
#btnImprimir:hover { background: #3a5a6a; }
#btnVerDetalles:hover { background: #4a6a5a; }
#btnCerrarModal:hover { background: #f0f7ff; }

/* Estilos del modal (inline con escala) */
#modalResultados > div {
    padding: calc(45px * var(--escala)) calc(40px * var(--escala)) calc(35px * var(--escala)) !important;
    max-width: calc(420px * var(--escala)) !important;
    width: 92% !important;
}

#modalResultados h3 {
    font-size: calc(18px * var(--escala)) !important;
}

#modalResultados p {
    font-size: calc(14px * var(--escala)) !important;
}

#modalResultados button {
    font-size: calc(15px * var(--escala)) !important;
    padding: calc(15px * var(--escala)) !important;
    margin-bottom: calc(12px * var(--escala)) !important;
}

/* Logo en el modal */
#modalResultados .logo-container {
    width: calc(180px * var(--escala)) !important;
    height: calc(100px * var(--escala)) !important;
    margin: 0 auto calc(12px * var(--escala)) !important;
}

#modalResultados .logo-container img {
    width: calc(180px * var(--escala)) !important;
    height: calc(100px * var(--escala)) !important;
}

#modalResultados .logo-container div {
    width: calc(180px * var(--escala)) !important;
    height: calc(100px * var(--escala)) !important;
    font-size: calc(48px * var(--escala)) !important;
}

#modalResultados .divider {
    width: calc(50px * var(--escala)) !important;
    height: calc(2px * var(--escala)) !important;
    margin: calc(10px * var(--escala)) auto 0 !important;
}
    </style>
</head>
<body>

<div class="header">
    <h1></h1>
    <div>Paciente: <strong id="nombrePaciente">--</strong></div>
</div>

<button class="btn-back" id="btnVolverDashboard" style="background: #1e3a8a; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-weight: bold;">
    ← Volver al Dashboard
</button>

<div class="tabs">
    <button class="tab-btn active" onclick="cambiarTab('audiometria')">Audiometría Tonal</button>
    <button class="tab-btn" onclick="cambiarTab('logoaudiometria')">Logoaudiometría</button>
    <button class="tab-btn grabar" onclick="grabarTodos()">GRABAR AMBOS</button>
</div>

<div class="tab-pane active" id="audiometria">
  <iframe src="AudiometriaTonal.html?modo=combinado" id="iframeAudiometria"></iframe>
    
</div>
<div class="tab-pane" id="logoaudiometria">
    <iframe src="Logoaudiometria.html?modo=combinado" id="iframeLogoaudiometria"></iframe>

</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-content">
        <div class="spinner"></div>
        <p>Guardando exámenes...</p>
    </div>
</div>

<script>
    // Cambiar pestaña
    function cambiarTab(tab) {
        document.querySelectorAll('.tab-pane').forEach(p => {
            p.classList.remove('active');
        });
        document.querySelectorAll('.tab-btn:not(.grabar)').forEach(b => {
            b.classList.remove('active');
        });
        document.getElementById(tab).classList.add('active');
        document.querySelector(`.tab-btn[onclick="cambiarTab('${tab}')"]`).classList.add('active');
    }
    
    // Cargar paciente
    function cargarPaciente() {
        const data = localStorage.getItem('pacienteActual');
        if (data) {
            const paciente = JSON.parse(data);
            document.getElementById('nombrePaciente').textContent = paciente.nombre || '--';
        }
    }
    cargarPaciente();
    window.addEventListener('storage', cargarPaciente);
    
    function mostrarLoading(mostrar) {
        document.getElementById('loadingOverlay').style.display = mostrar ? 'flex' : 'none';
    }
    
    function mostrarNotificacion(mensaje, esError = false) {
        const div = document.createElement('div');
        div.className = `notificacion ${esError ? 'error' : 'exito'}`;
        div.textContent = mensaje;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }
    

async function grabarTodos() {
    const btn = document.querySelector('.tab-btn.grabar');
    const textoOriginal = btn.textContent;
    btn.textContent = '⏳ Guardando...';
    btn.disabled = true;

    try {
        const citaData = localStorage.getItem('citaActual');
        if (!citaData) {
            mostrarNotificacion('❌ No hay cita seleccionada', true);
            btn.textContent = textoOriginal;
            btn.disabled = false;
            return;
        }

        const cita = JSON.parse(citaData);
        const citaId = cita?.id || cita?.id_cita || cita?.cita_id;

        if (!citaId) {
            mostrarNotificacion('❌ ID de cita no válido', true);
            btn.textContent = textoOriginal;
            btn.disabled = false;
            return;
        }

        const modoEdicion = localStorage.getItem('modoEdicion') === 'true';

        const funcionGuardar = async () => {
            return await ejecutarGuardadoReal(citaId, modoEdicion);
        };

        const resultado = await window.DuplicadoService.ejecutarConControl(
            funcionGuardar,
            citaId,
            { modoEdicion },
            mostrarNotificacion
        );

        if (!resultado.ok) {
            if (resultado.cancelado) return;
            if (resultado.enProceso) {
                mostrarNotificacion('⏳ Ya hay un proceso en curso', true);
                return;
            }
            mostrarNotificacion('❌ Error: ' + (resultado.error || 'Desconocido'), true);
            return;
        }

        if (resultado.pdfPath) {
            window.rutaPDFActual = resultado.pdfPath;
            window.datosExamenActual = resultado.datosParaDetalles;
            mostrarModalResultados();
        } else {
            mostrarNotificacion('✅ Exámenes guardados correctamente');
        }

    } catch (error) {
        console.error('❌ Error en grabarTodos:', error);
        mostrarNotificacion('❌ Error: ' + error.message, true);
    } finally {
        btn.textContent = textoOriginal;
        btn.disabled = false;
    }
}

// ============================================
// FUNCIÓN DE GUARDADO REAL (extraída de grabarTodos)
// ============================================
async function ejecutarGuardadoReal(citaId, modoEdicion = false) {
    console.log('🔄 Ejecutando guardado real para cita:', citaId, '| Edición:', modoEdicion);

    try {
        mostrarLoading(true);

        const pacienteData = localStorage.getItem('pacienteActual');
        const citaData = localStorage.getItem('citaActual');

        if (!pacienteData) throw new Error('No hay paciente seleccionado');

        const paciente = JSON.parse(pacienteData);
        const cita = citaData ? JSON.parse(citaData) : null;

        let pacienteId = paciente.id || paciente.id_paciente || paciente.paciente_id;

        if (!pacienteId) throw new Error('ID de paciente no válido');

        const iframeAudiometria = document.getElementById('iframeAudiometria');
        const iframeLogoaudiometria = document.getElementById('iframeLogoaudiometria');

        // Función para obtener datos de un iframe
        function obtenerDatosDeIframe(iframe, accion) {
            return new Promise((resolve) => {
                const handler = (event) => {
                    if (event.data && event.data.accion === accion) {
                        window.removeEventListener('message', handler);
                        resolve(event.data.datos);
                    }
                };
                window.addEventListener('message', handler);
                iframe.contentWindow.postMessage({ accion: accion }, '*');
                setTimeout(() => resolve(null), 5000);
            });
        }

        // Obtener datos de Audiometría
        const datosAudiometria = await obtenerDatosDeIframe(iframeAudiometria, 'obtenerTodoAudiometria');
        const datosLogoaudiometria = await obtenerDatosDeIframe(iframeLogoaudiometria, 'obtenerTodoLogoaudiometria');

        const tieneDatosAudiometria = datosAudiometria && datosAudiometria.tieneDatos;
        const tieneDatosLogoaudiometria = datosLogoaudiometria && datosLogoaudiometria.tieneDatos;

        if (!tieneDatosAudiometria && !tieneDatosLogoaudiometria) {
            throw new Error('No hay datos para guardar');
        }

        // Determinar tipo de examen
        let tipoExamen = cita?.tipo_atencion_nombre || 'combinado';

        if (tieneDatosAudiometria && !tieneDatosLogoaudiometria) {
            tipoExamen = 'audiometria';
        } else if (!tieneDatosAudiometria && tieneDatosLogoaudiometria) {
            tipoExamen = 'logoaudiometria';
        }

        // Construir objeto de datos
        const data = {
            tipo_examen: tipoExamen,
            paciente_id: parseInt(pacienteId),
            cita_id: parseInt(citaId),
            entidad_id: cita?.entidad_id || null,
           // diagnostico_od: datosAudiometria?.diagnostico_od || '',
           // diagnostico_oi: datosAudiometria?.diagnostico_oi || '',
            diagnostico_od: datosLogoaudiometria?.diagnostico_od || '',
            diagnostico_oi: datosLogoaudiometria?.diagnostico_oi || '',
            observaciones: datosAudiometria?.observaciones || '',
            otoscopia: datosAudiometria?.otoscopia || '',
            grafica_tonal_base64: datosAudiometria?.grafica || '',
            grafica_logo_base64: datosLogoaudiometria?.grafica || '',
            valores_od: datosAudiometria?.valores_od || {},
            valores_oi: datosAudiometria?.valores_oi || {},
            pta_via_aerea_od: datosAudiometria?.pta?.od_air || null,
            pta_via_osea_od: datosAudiometria?.pta?.od_bone || null,
            pta_via_aerea_oi: datosAudiometria?.pta?.oi_air || null,
            pta_via_osea_oi: datosAudiometria?.pta?.oi_bone || null,
          //  diagnostico: datosLogoaudiometria?.diagnostico || '',
           diagnostico: datosAudiometria?.diagnostico || '',
            urv_od: datosLogoaudiometria?.urv_od ? parseInt(datosLogoaudiometria.urv_od) : null,
            urv_oi: datosLogoaudiometria?.urv_oi ? parseInt(datosLogoaudiometria.urv_oi) : null,
            upalabra_od: datosLogoaudiometria?.upalabra_od ? parseInt(datosLogoaudiometria.upalabra_od) : null,
            upalabra_oi: datosLogoaudiometria?.upalabra_oi ? parseInt(datosLogoaudiometria.upalabra_oi) : null,
            udisc_od: datosLogoaudiometria?.udisc_od ? parseInt(datosLogoaudiometria.udisc_od) : null,
            udisc_oi: datosLogoaudiometria?.udisc_oi ? parseInt(datosLogoaudiometria.udisc_oi) : null,
            pmax_od: datosLogoaudiometria?.pmax_od ? parseInt(datosLogoaudiometria.pmax_od) : null,
            pmax_oi: datosLogoaudiometria?.pmax_oi ? parseInt(datosLogoaudiometria.pmax_oi) : null
        };

        // Guardar en base de datos
      let examenGuardado = false;
    let apiResult = null;

    if (modoEdicion && window.api?.actualizarExamen) {
        apiResult = await window.api.actualizarExamen(parseInt(citaId), data);
    } else if (window.api?.guardarExamen) {
        apiResult = await window.api.guardarExamen(data);
    }

    if (apiResult && apiResult.ok) {
        examenGuardado = true;
        localStorage.removeItem('modoEdicion');
        localStorage.removeItem('examenActual');
        localStorage.removeItem('citaIdEdicion');
    }

    if (!examenGuardado) {
        throw new Error('No se pudo guardar el examen');
    }

        // Generar PDF
        let rutaPDF = null;
        let datosParaDetalles = null;

        const entidadNombre = cita?.entidad_nombre || 'PARTICULAR';

        // Preparar datos para PDF
        const datosPDFAudiometria = {
            paciente: { nombre: paciente.nombre || '', documento: paciente.documento || '' },
            cita: { fecha_cita: cita?.fecha_cita || new Date().toISOString().split('T')[0] },
            valores_od: datosAudiometria?.valores_od || {},
            valores_oi: datosAudiometria?.valores_oi || {},
            freqs: ['250', '500', '750', '1000', '1500', '2000', '3000', '4000', '6000', '8000'],
         //   diagnostico_od: datosAudiometria?.diagnostico_od || '',
          //  diagnostico_oi: datosAudiometria?.diagnostico_oi || '',
         diagnostico: datosAudiometria?.diagnostico || '',
            observaciones: datosAudiometria?.observaciones || '',
            otoscopia: datosAudiometria?.otoscopia || '',
            grafica_tonal_base64: datosAudiometria?.grafica || '',
            pta: {
                od_air: datosAudiometria?.pta?.od_air || null,
                oi_air: datosAudiometria?.pta?.oi_air || null,
                od_bone: datosAudiometria?.pta?.od_bone || null,
                oi_bone: datosAudiometria?.pta?.oi_bone || null
            }
        };

        const datosPDFLogoaudiometria = {
            paciente: { nombre: paciente.nombre || '', documento: paciente.documento || '' },
            valores_od: {
                urv: datosLogoaudiometria?.urv_od || null,
                upalabra: datosLogoaudiometria?.upalabra_od || null,
                udisc: datosLogoaudiometria?.udisc_od || null,
                pmax: datosLogoaudiometria?.pmax_od || null
            },
            valores_oi: {
                urv: datosLogoaudiometria?.urv_oi || null,
                upalabra: datosLogoaudiometria?.upalabra_oi || null,
                udisc: datosLogoaudiometria?.udisc_oi || null,
                pmax: datosLogoaudiometria?.pmax_oi || null
            },
         //   diagnostico: datosLogoaudiometria?.diagnostico || '',
         
            diagnostico_od: datosLogoaudiometria?.diagnostico_od || '',
            diagnostico_oi: datosLogoaudiometria?.diagnostico_oi || '',
            grafica_logo_base64: datosLogoaudiometria?.grafica || '',
            nr_flags: datosLogoaudiometria?.nr_flags || { od: {}, oi: {} }
        };

        // Generar PDF combinado
        let pdfResult;
        if (entidadNombre === 'COOSALUD') {
            if (window.api?.generarPDFCombinadoCoosalud) {
                pdfResult = await window.api.generarPDFCombinadoCoosalud(
                    datosPDFAudiometria,
                    datosPDFLogoaudiometria,
                    entidadNombre
                );
            }
        } else {
            if (window.api?.generarPDFCombinado) {
                pdfResult = await window.api.generarPDFCombinado(
                    datosPDFAudiometria,
                    datosPDFLogoaudiometria,
                    entidadNombre
                );
            }
        }

        if (pdfResult && pdfResult.ok) {
            rutaPDF = pdfResult.path;
            console.log('✅ PDF generado:', rutaPDF);
        }

        // Preparar datos para detalles
        datosParaDetalles = {
            paciente: paciente.nombre || 'No especificado',
            documento: paciente.documento || 'No especificado',
            fecha: cita?.fecha_cita || new Date().toISOString().split('T')[0],
            entidad: cita?.entidad_nombre || 'Particular',
            tipo_examen: (tieneDatosAudiometria && tieneDatosLogoaudiometria) ? 'Combinado' :
                         (tieneDatosAudiometria ? 'Audiometría' :
                         (tieneDatosLogoaudiometria ? 'Logoaudiometría' : 'Sin datos')),
            observaciones: datosAudiometria?.observaciones || datosLogoaudiometria?.diagnostico || 'Sin observaciones',
            cita_id: citaId,
            cita: cita,
            audiometria: datosAudiometria ? {
             //   diagnostico_od: datosAudiometria.diagnostico_od || '',
             //   diagnostico_oi: datosAudiometria.diagnostico_oi || '',
             diagnostico: datosAudiometria.diagnostico || '',
                observaciones: datosAudiometria.observaciones || '',
                otoscopia: datosAudiometria.otoscopia || '',
                via_aerea: {
                    od: datosAudiometria.valores_od || {},
                    oi: datosAudiometria.valores_oi || {}
                },
                via_osea: {

             //   diagnostico: datosLogoaudiometria.diagnostico || '',

                diagnostico_oi: datosLogoaudiometria.diagnostico_oi || '',

                pmax_od: datosLogoaudiometria.pmax_od || null,
                pmax_oi: datosLogoaudiometria.pmax_oi || null
            } : null
        };

        return {
            ok: true,
            pdfPath: rutaPDF,
            datosParaDetalles: datosParaDetalles,
            examenGuardado: true
        };

    } catch (error) {
        console.error('❌ Error en ejecutarGuardadoReal:', error);

    } finally {

    }
}

async function probarPDF() {
    console.log('\n========== 🧪 PRUEBA PDF EN CONSOLA ==========');
    
    try {
        // Obtener datos del paciente
        const pacienteData = localStorage.getItem('pacienteActual');
        const paciente = pacienteData ? JSON.parse(pacienteData) : null;
        
        // Obtener datos de los iframes
        const iframeAudiometria = document.getElementById('iframeAudiometria');
        const iframeLogoaudiometria = document.getElementById('iframeLogoaudiometria');
        
        function obtenerDatos(iframe, accion) {
            return new Promise((resolve) => {
                const handler = (event) => {
                    if (event.data && event.data.accion === accion) {
                        window.removeEventListener('message', handler);
                        resolve(event.data.datos);
                    }
                };
                window.addEventListener('message', handler);
                iframe.contentWindow.postMessage({ accion: accion }, '*');
                setTimeout(() => resolve(null), 5000);
            });
        }
        
        const datosAudiometria = await obtenerDatos(iframeAudiometria, 'obtenerTodoAudiometria');
        const datosLogoaudiometria = await obtenerDatos(iframeLogoaudiometria, 'obtenerTodoLogoaudiometria');
        
        // Preparar datos para PDF
        const datosPDFAudiometria = {
            paciente: { nombre: paciente?.nombre || 'Prueba', documento: paciente?.documento || '123' },
            valores_od: datosAudiometria?.valores_od || {},
            valores_oi: datosAudiometria?.valores_oi || {},
            freqs: ['250', '500', '750', '1000', '1500', '2000', '3000', '4000', '6000', '8000'],
         //   diagnostico_od: datosAudiometria?.diagnostico_od || '',
          //  diagnostico_oi: datosAudiometria?.diagnostico_oi || '',
           diagnostico: datosAudiometria?.diagnostico || '',
            observaciones: datosAudiometria?.observaciones || '',
            otoscopia: datosAudiometria?.otoscopia || '',
            grafica_base64: datosAudiometria?.grafica || '',
            pta: {
                od_air: datosAudiometria?.pta?.od_air || null,
                oi_air: datosAudiometria?.pta?.oi_air || null,
                od_bone: datosAudiometria?.pta?.od_bone || null,
                oi_bone: datosAudiometria?.pta?.oi_bone || null
            }
        };
        
        const datosPDFLogoaudiometria = {
            paciente: { nombre: paciente?.nombre || 'Prueba', documento: paciente?.documento || '123' },
            valores_od: {
                urv: datosLogoaudiometria?.urv_od || null,
                upalabra: datosLogoaudiometria?.upalabra_od || null,
                udisc: datosLogoaudiometria?.udisc_od || null,
                pmax: datosLogoaudiometria?.pmax_od || null
            },
            valores_oi: {
                urv: datosLogoaudiometria?.urv_oi || null,
                upalabra: datosLogoaudiometria?.upalabra_oi || null,
                udisc: datosLogoaudiometria?.udisc_oi || null,
                pmax: datosLogoaudiometria?.pmax_oi || null
            },
         //   diagnostico: datosLogoaudiometria?.diagnostico || '',
            diagnostico_od: datosLogoaudiometria?.diagnostico_od || '',
            diagnostico_oi: datosLogoaudiometria?.diagnostico_oi || '',
            grafica_base64: datosLogoaudiometria?.grafica || '',
            nr_flags: datosLogoaudiometria?.nr_flags || { od: {}, oi: {} }
        };
        
        console.log('📊 Datos preparados para PDF');
        console.log('   - Audiometría:', datosPDFAudiometria.valores_od);
        console.log('   - Logoaudiometría:', datosPDFLogoaudiometria.valores_od);
        
        // 🔥 GENERAR PDF
        console.log('\n📄 Generando PDF combinado...');
        
        const result = await window.api.generarPDFCombinado(
            datosPDFAudiometria, 
            datosPDFLogoaudiometria, 
            'U.D.A'
        );
        
        console.log('✅ Resultado:', result);
        
        if (result && result.ok) {
            console.log('📁 Ruta del PDF:', result.path);
            console.log('💡 Para abrirlo: window.api.abrirPDFNativo("' + result.path + '")');
            
            // Verificar si el archivo existe
            try {
                const fs = require('fs');
                if (fs.existsSync(result.path)) {
                    const stats = fs.statSync(result.path);
                    console.log('📏 Tamaño:', (stats.size / 1024).toFixed(2), 'KB');
                }
            } catch (e) {
                console.log('⚠️ No se pudo verificar el tamaño del archivo');
            }
            
            console.log('\n✅ PDF generado correctamente en TODAS las pantallas');
            console.log('   (El PDF siempre se genera en 1200x900)');
        } else {
            console.error('❌ Error:', result?.error || 'Error desconocido');
        }
        
    } catch (error) {
        console.error('❌ Error:', error.message);
        console.error('Stack:', error.stack);
    }
    
    console.log('\n========== FIN PRUEBA ==========');
}

// 3. FUNCIÓN PARA INYECTAR CÓDIGO EN UN IFRAME
function inyectarScriptEnIframe(iframe) {
    try {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (!iframeDoc) return false;
        
        // Verificar si ya tiene el script
        if (iframeDoc.querySelector('script[data-ctrl-g]')) {
            return true;
        }
        
        // Crear el script
        const script = iframeDoc.createElement('script');
        script.setAttribute('data-ctrl-g', 'true');
        script.textContent = `
            // ============================================
            // 🎯 Ctrl+G PARA GRABAR (inyectado desde el padre)
            // ============================================
            document.addEventListener('keydown', function(e) {
                const esCtrlG = (e.ctrlKey || e.metaKey) && (e.key === 'g' || e.key === 'G');
                
                if (esCtrlG) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('⌨️ Ctrl+G en iframe - Enviando mensaje al padre');
                    window.parent.postMessage({ accion: 'ctrlGrabar' }, '*');
                    
                    // INTENTAR LLAMAR DIRECTAMENTE (fallback)
                    try {
                        if (window.parent && window.parent.grabarTodos) {
                            window.parent.grabarTodos();
                        }
                    } catch(err) {}
                }
            });
            console.log('✅ Ctrl+G activado en iframe');
        `;
        
        iframeDoc.body.appendChild(script);
        console.log('✅ Ctrl+G inyectado en iframe:', iframe.src || 'iframe');
        return true;
        
    } catch (e) {
        console.log('⚠️ No se puede inyectar en iframe (cross-origin):', iframe.src);
        return false;
    }
}

// 4. FUNCIÓN PARA INYECTAR EN TODOS LOS IFRAMES
function inyectarAtajoEnIframes() {
    const iframes = document.querySelectorAll('iframe');
    let inyectados = 0;
    
    iframes.forEach(iframe => {
        // Intentar inyectar inmediatamente
        if (inyectarScriptEnIframe(iframe)) {
            inyectados++;
        } else {
            // Si falla, esperar a que cargue
            iframe.addEventListener('load', function() {
                setTimeout(() => {
                    inyectarScriptEnIframe(iframe);
                }, 300);
            });
        }
    });
    
    console.log(`📦 Ctrl+G inyectado en ${inyectados} de ${iframes.length} iframes`);
}

// 5. INYECTAR CUANDO EL DOM ESTÉ LISTO
document.addEventListener('DOMContentLoaded', function() {
    // Intentar varias veces con intervalos
    const intervalos = [500, 1000, 2000, 3000];
    intervalos.forEach((tiempo, index) => {
        setTimeout(() => {
            console.log(`🔄 Intento ${index + 1} de inyección...`);
            inyectarAtajoEnIframes();
        }, tiempo);
    });
});

// 6. INYECTAR DESPUÉS DE CAMBIAR DE PESTAÑA
const cambiarTabOriginal2 = window.cambiarTab;
window.cambiarTab = function(tab) {
    cambiarTabOriginal2(tab);
    // Esperar a que el iframe se cargue
    setTimeout(() => {
        inyectarAtajoEnIframes();
    }, 800);
    // Intentar nuevamente después de un poco más
    setTimeout(() => {
        inyectarAtajoEnIframes();
    }, 1500);
};

// 7. OBSERVAR CAMBIOS EN EL DOM (por si se agregan iframes dinámicamente)
const observerIframes = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
        if (mutation.addedNodes.length) {
            mutation.addedNodes.forEach(function(node) {
                if (node.tagName === 'IFRAME') {
                    setTimeout(() => {
                        inyectarScriptEnIframe(node);
                    }, 500);
                }
            });
        }
    });
});

observerIframes.observe(document.body, {
    childList: true,
    subtree: true
});
