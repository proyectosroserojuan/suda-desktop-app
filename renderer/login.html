<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>

  <div class="login-container">

      <!-- ANIMACIÓN LOTTIE ARRIBA -->


    <!-- LADO IZQUIERDO -->
<!-- LADO IZQUIERDO -->
<div class="login-left">
  <!-- Animación Lottie -->
  <div class="lottie-white">
    <lottie-player 
      src="../img/listening.json" 
      background="transparent" 
      speed="1" 
      style="width: 200px; height: 200px;" 
      loop 
      autoplay>
    </lottie-player>
  </div>
  
  <!-- TÍTULO CON NEGRILLA Y SOMBRA -->
  <h1 class="titulo-bienvenida">
    BIENVENIDO A <strong class="uda-destacado">S.U.D.A</strong><br>
    <span class="subtitulo-sistema">SISTEMA CLÍNICO DE UNIDAD DIAGNÓSTICA AUDITIVA</span>
  </h1>
  
  <p class="nombre-licenciado">LUIS IGNACIO SANÍN</p>
</div>

    <!-- LADO DERECHO -->
<div class="login-right">
  <button id="btnActualizar">Buscar actualizaciones</button>
<div id="estadoActualizacion"></div>

     <!-- CONTENEDOR DEL LOGO HORIZONTAL -->
      <div class="logo-container">
      <div class="audiologo-info">
  <div class="nombre-curvo">Luis Ignacio Sanín Jurado</div>
  <div class="titulo-serio">Audiólogo Clínico y Laboral</div>
</div>
     <img src="../img/saninlogo.jpg" alt="Logo U.D.A.">
      </div>

  
  <div class="login-card">
    <h2>Iniciar sesión</h2>

    <input id="username" type="text" placeholder="Usuario" />
    <input id="password" type="password" placeholder="Contraseña" />

    <button onclick="login()">Ingresar</button>

    <br><br>
   
  </div>

</div>

  </div>

  <script src="login.js"></script>
  <script src="../services/noticiasService.js"></script>
   <script src="../renderer/focus-fix.js"></script>
   <script>
// ============================================
// ESCALA UNIFORME PARA EL LOGIN
// ============================================

function calcularEscala() {
    const ancho = window.innerWidth;
    const alto = window.innerHeight;
    let escala = Math.min(ancho / 1366, alto / 768);
    return Math.max(0.6, Math.min(1.5, escala));
}

function aplicarEscala() {
    const escala = calcularEscala();
    document.documentElement.style.setProperty('--escala', escala);
}

document.addEventListener('DOMContentLoaded', aplicarEscala);

let tiempoEspera;
window.addEventListener('resize', function() {
    clearTimeout(tiempoEspera);
    tiempoEspera = setTimeout(aplicarEscala, 150);
});



document.getElementById('btnActualizar').addEventListener('click', async () => {
  const estado = document.getElementById('estadoActualizacion');
  estado.textContent = '🔍 Verificando actualizaciones...';
  estado.style.color = 'blue';

  try {
    const result = await window.api.checkForUpdates();
    console.log('📦 Resultado:', result);

    if (result.ok && result.result && result.result.isUpdateAvailable) {
      estado.textContent = `⬇️ Descargando actualización ${result.result.versionInfo.version}...`;
      estado.style.color = 'green';
      
      // ✅ INICIAR DESCARGA MANUAL
      await window.api.downloadUpdate();
      
      // ✅ El progreso se muestra a través de onDownloadProgress
    } else {
      estado.textContent = '✅ No hay actualizaciones disponibles.';
      estado.style.color = 'gray';
    }
  } catch (error) {
    console.error('❌ Error:', error);
    estado.textContent = '❌ Error al verificar actualizaciones.';
    estado.style.color = 'red';
  }
});

// Progreso real de la descarga
window.api.onDownloadProgress((progress) => {
  const estado = document.getElementById('estadoActualizacion');
  estado.textContent = `⬇️ Descargando: ${progress.percent.toFixed(1)}%`;
});

// Se activa SOLO cuando el archivo terminó de descargarse de verdad
window.api.onUpdateDownloaded((version) => {
  const estado = document.getElementById('estadoActualizacion');
  estado.textContent = `✅ Actualización ${version} lista. La app se cerrará para instalar...`;
  estado.style.color = 'green';
  // El diálogo nativo (main.js) ya se encarga de preguntar y llamar quitAndInstall()
});

// ============================================
// NAVEGACIÓN CON TECLADO (Enter)
// ============================================

document.addEventListener('DOMContentLoaded', function() {
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    
    // Cuando presionas Enter en el campo USUARIO → pasa a CONTRASEÑA
    usernameInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault(); // Evita que haga submit
            passwordInput.focus();   // Enfoca el campo contraseña
        }
    });
    
    // Cuando presionas Enter en el campo CONTRASEÑA → ejecuta login
    passwordInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            login(); // Ejecuta la función de login
        }
    });
});
</script>
</body>
</html>
