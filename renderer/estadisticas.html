<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informes y Estadísticas | Sistema Médico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --escala: 1;
            --azul-claro: #e6f0ff;
            --azul-suave: #b8d4ff;
            --azul-medio: #7bb3f0;
            --azul-principal: #4a90d9;
            --azul-oscuro: #2c6aa0;
            --azul-bg: #f5f9ff;
            --azul-borde: #d4e4fc;
            --azul-hover: #3a7bc8;
        }

        body {
            font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--azul-bg);
            padding: 0;
            color: #1e293b;
            font-size: calc(16px * var(--escala));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 100vw;
            overflow-x: hidden;
        }

        .header-corporativo {
            background: linear-gradient(135deg, #5b9bd5 0%, #3a7bc8 50%, #b8d4ff 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(16px * var(--escala)) calc(24px * var(--escala));
            border-radius: calc(16px * var(--escala));
            margin: calc(16px * var(--escala));
            margin-bottom: calc(24px * var(--escala));
            gap: calc(12px * var(--escala));
            box-shadow: 0 calc(4px * var(--escala)) calc(20px * var(--escala)) rgba(74, 144, 217, 0.25);
            flex-wrap: wrap;
        }

        .logo-text h1 {
            font-size: calc(1.3rem * var(--escala));
            font-weight: 700;
            color: #ffffff;
        }
        .logo-text span {
            display: block;
            font-size: calc(0.7rem * var(--escala));
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: calc(1.5px * var(--escala)) solid rgba(255, 255, 255, 0.3);
            padding: calc(8px * var(--escala)) calc(16px * var(--escala));
            border-radius: calc(30px * var(--escala));
            font-weight: 600;
            cursor: pointer;
            font-size: calc(0.75rem * var(--escala));
            display: inline-flex;
            align-items: center;
            gap: calc(8px * var(--escala));
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(calc(-2px * var(--escala)));
        }

        .container {
            max-width: 100%;
            width: 100%;
            padding: 0 calc(16px * var(--escala)) calc(24px * var(--escala));
            flex: 1;
        }

        /* Filtros */
        .filters-section {
            background: #ffffff;
            border-radius: calc(12px * var(--escala));
            padding: calc(18px * var(--escala)) calc(24px * var(--escala));
            margin-bottom: calc(24px * var(--escala));
            border: calc(1px * var(--escala)) solid var(--azul-borde);
            display: flex;
            gap: calc(16px * var(--escala));
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 calc(2px * var(--escala)) calc(8px * var(--escala)) rgba(74, 144, 217, 0.06);
        }

        .filters-section label {
            font-size: calc(0.75rem * var(--escala));
            font-weight: 600;
            color: var(--azul-oscuro);
        }

        .filters-section select {
            padding: calc(10px * var(--escala)) calc(14px * var(--escala));
            border: calc(1.5px * var(--escala)) solid var(--azul-borde);
            border-radius: calc(10px * var(--escala));
            font-size: calc(0.85rem * var(--escala));
            font-family: inherit;
            background: #ffffff;
            color: #1e293b;
            cursor: pointer;
        }
        .filters-section select:focus {
            border-color: var(--azul-principal);
            outline: none;
        }

        .btn-primary {
            background: var(--azul-principal);
            color: #ffffff;
            border: none;
            padding: calc(10px * var(--escala)) calc(20px * var(--escala));
            border-radius: calc(10px * var(--escala));
            font-weight: 600;
            cursor: pointer;
            font-size: calc(0.85rem * var(--escala));
            display: inline-flex;
            align-items: center;
            gap: calc(8px * var(--escala));
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: var(--azul-hover);
            transform: translateY(calc(-1px * var(--escala)));
        }

        /* Tarjetas resumen */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: calc(16px * var(--escala));
            margin-bottom: calc(24px * var(--escala));
        }

        .stat-card {
            background: #ffffff;
            border-radius: calc(14px * var(--escala));
            padding: calc(18px * var(--escala)) calc(20px * var(--escala));
            border: calc(1px * var(--escala)) solid var(--azul-borde);
            box-shadow: 0 calc(2px * var(--escala)) calc(8px * var(--escala)) rgba(74, 144, 217, 0.06);
            display: flex;
            align-items: center;
            gap: calc(14px * var(--escala));
        }

        .stat-card .icono {
            width: calc(48px * var(--escala));
            height: calc(48px * var(--escala));
            border-radius: calc(12px * var(--escala));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(1.3rem * var(--escala));
            flex-shrink: 0;
            color: #ffffff;
        }
        .icono.total { background: var(--azul-principal); }
        .icono.pendiente { background: #e0a336; }
        .icono.atendida { background: #2c9b6e; }
        .icono.cancelada { background: #d97a7a; }

        .stat-card .numero {
            font-size: calc(1.6rem * var(--escala));
            font-weight: 700;
            color: #0f172a;
            line-height: 1.1;
        }
        .stat-card .etiqueta {
            font-size: calc(0.75rem * var(--escala));
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* Gráficas */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: calc(20px * var(--escala));
        }

        .chart-card {
            background: #ffffff;
            border-radius: calc(14px * var(--escala));
            padding: calc(20px * var(--escala));
            border: calc(1px * var(--escala)) solid var(--azul-borde);
            box-shadow: 0 calc(2px * var(--escala)) calc(8px * var(--escala)) rgba(74, 144, 217, 0.06);
        }

        .chart-card.full-width {
            grid-column: 1 / -1;
        }

        .chart-card h3 {
            font-size: calc(1rem * var(--escala));
            color: var(--azul-oscuro);
            margin-bottom: calc(16px * var(--escala));
            display: flex;
            align-items: center;
            gap: calc(8px * var(--escala));
        }

        .chart-wrapper {
            position: relative;
            height: calc(320px * var(--escala));
        }

        .chart-wrapper.pequeno {
            height: calc(280px * var(--escala));
        }

        .empty-chart {
            text-align: center;
            padding: calc(40px * var(--escala)) calc(20px * var(--escala));
            color: #94a3b8;
        }
        .empty-chart i {
            font-size: calc(2rem * var(--escala));
            margin-bottom: calc(10px * var(--escala));
            color: var(--azul-principal);
        }

        .loading-state {
            text-align: center;
            padding: calc(60px * var(--escala)) calc(20px * var(--escala));
            color: #64748b;
        }
        .spinner {
            display: inline-block;
            width: calc(32px * var(--escala));
            height: calc(32px * var(--escala));
            border: calc(3px * var(--escala)) solid var(--azul-borde);
            border-top: calc(3px * var(--escala)) solid var(--azul-principal);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: calc(12px * var(--escala));
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr; }
            .filters-section { flex-direction: column; align-items: stretch; }
            .filters-section select { width: 100%; }
        }
    </style>
</head>
<body>
    <header class="header-corporativo">
        <div class="logo-text">
            <h1>Informes y Estadísticas</h1>
            <span>S.U.D.A - Reportes de gestión mensual</span>
        </div>
        <button class="btn-back" id="btnVolverDashboard">
            <i class="fas fa-arrow-left"></i> <span>Volver al Dashboard</span>
        </button>
    </header>

    <div class="container">
        <!-- Filtros -->
        <div class="filters-section">
            <label>Mes:</label>
            <select id="filtroMes"></select>

            <label>Año:</label>
            <select id="filtroAnio"></select>

            <button class="btn-primary" id="btnGenerar">
                <i class="fas fa-chart-pie"></i> Generar Informe
            </button>
        </div>

        <!-- Tarjetas resumen -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icono total"><i class="fas fa-calendar-check"></i></div>
                <div>
                    <div class="numero" id="numTotal">0</div>
                    <div class="etiqueta">Total citas</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="icono pendiente"><i class="fas fa-clock"></i></div>
                <div>
                    <div class="numero" id="numPendientes">0</div>
                    <div class="etiqueta">Pendientes</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="icono atendida"><i class="fas fa-check-circle"></i></div>
                <div>
                    <div class="numero" id="numAtendidas">0</div>
                    <div class="etiqueta">Atendidas</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="icono cancelada"><i class="fas fa-times-circle"></i></div>
                <div>
                    <div class="numero" id="numCanceladas">0</div>
                    <div class="etiqueta">Canceladas</div>
                </div>
            </div>
        </div>

        <!-- Gráficas -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3><i class="fas fa-chart-pie"></i> Distribución de citas por estado</h3>
                <div class="chart-wrapper">
                    <canvas id="chartEstados"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3><i class="fas fa-chart-pie"></i> Citas atendidas por entidad</h3>
                <div class="chart-wrapper">
                    <canvas id="chartEntidad"></canvas>
                </div>
            </div>

            <div class="chart-card full-width">
                <h3><i class="fas fa-chart-bar"></i> Citas atendidas por tipo de atención</h3>
                <div class="chart-wrapper">
                    <canvas id="chartTipoAtencion"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chartEstados = null;
        let chartEntidad = null;
        let chartTipoAtencion = null;

        const COLORES = ['#4a90d9', '#2c9b6e', '#e0a336', '#d97a7a', '#7bb3f0',
                          '#8e6bd9', '#d97ab8', '#5bb5a2', '#c9a227', '#6a89cc'];

        function poblarFiltros() {
            const meses = [
                'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];
            const selectMes = document.getElementById('filtroMes');
            const hoy = new Date();

            meses.forEach((nombre, i) => {
                const option = document.createElement('option');
                option.value = i + 1;
                option.textContent = nombre;
                if (i + 1 === hoy.getMonth() + 1) option.selected = true;
                selectMes.appendChild(option);
            });

            const selectAnio = document.getElementById('filtroAnio');
            const anioActual = hoy.getFullYear();
            for (let a = anioActual; a >= anioActual - 4; a--) {
                const option = document.createElement('option');
                option.value = a;
                option.textContent = a;
                if (a === anioActual) option.selected = true;
                selectAnio.appendChild(option);
            }
        }

        async function generarInforme() {
            const mes = parseInt(document.getElementById('filtroMes').value);
            const anio = parseInt(document.getElementById('filtroAnio').value);

            const btn = document.getElementById('btnGenerar');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generando...';
            btn.disabled = true;

            try {
                const response = await window.api.obtenerReporteEstadisticas(mes, anio);
                if (!response.ok) throw new Error(response.error || 'Error al generar el informe');

                const { resumen, porTipo, porEntidad } = response.reporte;

                actualizarTarjetas(resumen);
                dibujarChartEstados(resumen);
                dibujarChartEntidad(porEntidad);
                dibujarChartTipoAtencion(porTipo);

            } catch (error) {
                alert('Error al generar el informe: ' + error.message);
            } finally {
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
            }
        }

        function actualizarTarjetas(resumen) {
            document.getElementById('numTotal').textContent = resumen.total || 0;
            document.getElementById('numPendientes').textContent =
                (resumen.pendiente || 0) + (resumen.confirmada || 0);
            document.getElementById('numAtendidas').textContent = resumen.atendida || 0;
            document.getElementById('numCanceladas').textContent =
                (resumen.cancelada || 0) + (resumen.no_asistio || 0);
        }

        function dibujarChartEstados(resumen) {
            const ctx = document.getElementById('chartEstados');
            const datos = [
                { label: 'Pendientes', value: (resumen.pendiente || 0) + (resumen.confirmada || 0) },
                { label: 'Atendidas', value: resumen.atendida || 0 },
                { label: 'Canceladas', value: (resumen.cancelada || 0) + (resumen.no_asistio || 0) }
            ];

            if (chartEstados) chartEstados.destroy();

            if (datos.every(d => d.value === 0)) {
                mostrarVacio('chartEstados');
                return;
            }

            chartEstados = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: datos.map(d => d.label),
                    datasets: [{
                        data: datos.map(d => d.value),
                        backgroundColor: ['#e0a336', '#2c9b6e', '#d97a7a'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 16, font: { size: 12 } } },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                                    const pct = total ? ((ctx.parsed / total) * 100).toFixed(1) : 0;
                                    return `${ctx.label}: ${ctx.parsed} (${pct}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function dibujarChartEntidad(porEntidad) {
            const ctx = document.getElementById('chartEntidad');

            if (chartEntidad) chartEntidad.destroy();

            if (!porEntidad || porEntidad.length === 0) {
                mostrarVacio('chartEntidad');
                return;
            }

            chartEntidad = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: porEntidad.map(r => r.entidad),
                    datasets: [{
                        data: porEntidad.map(r => r.cantidad),
                        backgroundColor: COLORES,
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 14, font: { size: 11 } } }
                    }
                }
            });
        }

        function dibujarChartTipoAtencion(porTipo) {
            const ctx = document.getElementById('chartTipoAtencion');

            if (chartTipoAtencion) chartTipoAtencion.destroy();

            if (!porTipo || porTipo.length === 0) {
                mostrarVacio('chartTipoAtencion');
                return;
            }

            chartTipoAtencion = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: porTipo.map(r => r.tipo_atencion),
                    datasets: [{
                        label: 'Citas atendidas',
                        data: porTipo.map(r => r.cantidad),
                        backgroundColor: '#4a90d9',
                        borderRadius: 6,
                        maxBarThickness: 60
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1, precision: 0 }
                        },
                        x: {
                            ticks: { autoSkip: false, maxRotation: 30, minRotation: 0, font: { size: 11 } }
                        }
                    }
                }
            });
        }

        function mostrarVacio(canvasId) {
            const canvas = document.getElementById(canvasId);
            const wrapper = canvas.parentElement;
            wrapper.innerHTML = `
                <div class="empty-chart">
                    <i class="fas fa-chart-bar"></i>
                    <p>No hay datos para este período</p>
                </div>
            `;
        }

        document.getElementById('btnVolverDashboard').addEventListener('click', function() {
            if (window.api?.volverDashboard) window.api.volverDashboard();
            else window.location.href = 'dashboard.html';
        });

        document.getElementById('btnGenerar').addEventListener('click', generarInforme);

        // ===== ESCALA =====
        function calcularEscala() {
            const ancho = window.innerWidth;
            const alto = window.innerHeight;
            let escala = Math.min(ancho / 1366, alto / 768);
            return Math.max(0.7, Math.min(1.5, escala));
        }
        function aplicarEscala() {
            document.documentElement.style.setProperty('--escala', calcularEscala());
        }
        window.addEventListener('resize', function() {
            clearTimeout(window._tiempoEspera);
            window._tiempoEspera = setTimeout(aplicarEscala, 150);
        });

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            aplicarEscala();
            poblarFiltros();
            generarInforme();
        });
    </script>
</body>
</html>
