        /* Header corporativo con más azul */
/* Header corporativo con más azul */
.header-corporativo {
    background: linear-gradient(135deg, #0e469b 0%, #1a3a6a 50%, #d7e2fa 100%);
    display: flex;
    justify-content: space-between;
    align-items: center;

<body>
    <div class="container">
        <!-- Header Corporativo con Logo -->
        <header class="header-corporativo">
<div class="header-logo">
    <img src="../img/saninlogo.jpg" alt="Logo U.D.A." class="logo-empresa" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'font-weight:700;color:#ffffff;font-size:1.5rem;\'>U.D.A.</span>'">
    <div class="logo-text">
        <h1>Historico de Examenes</h1>
        <span>S.U.D.A - Sistema de Unidad Diagnostica Auditiva</span>
    </div>
</div>

    <button class="btn-back" id="btnVolverDashboard">
        <i class="fas fa-arrow-left"></i> Volver al Dashboard
    </button>
            <div class="header-stats">
                <div class="stat-item">
                    <span class="number" id="totalCitas">0</span>
                    <span class="label">Total</span>
                </div>
                <div class="stat-item">
                    <span class="number" id="citasPendientes">0</span>
                    <span class="label">Pendientes</span>
                </div>
                <button class="btn-primary" id="btnActualizar">
                    <i class="fas fa-sync-alt"></i> Actualizar
                </button>
            </div>
        </header>

        <!-- Filtros -->
        <div class="filters-section">
            <select id="filtroEstado">
                <option value="todos">Todos los estados</option>
                <option value="pendiente">Pendiente</option>
                <option value="confirmada">Confirmada</option>
                <option value="atendida">Atendida</option>
                <option value="cancelada">Cancelada</option>
            </select>
            <select id="filtroExamen">
                <option value="todos">Todos</option>
                <option value="con">Con examen</option>
                <option value="sin">Sin examen</option>
            </select>
            <select id="filtroPrioridad">
                <option value="todos">Todas las prioridades</option>
                <option value="alta">Alta</option>
                <option value="normal">Normal</option>
            </select>
            <input type="text" id="buscador" placeholder="Buscar paciente...">
        </div>

        <!-- Filtros rápidos de fecha -->
<div class="filtros-fecha-rapidos">
    <span class="filtro-label"><i class="fas fa-clock"></i> Rápido:</span>
    <button class="btn-filtro-fecha" data-rango="hoy">Hoy</button>
    <button class="btn-filtro-fecha" data-rango="ayer">Ayer</button>
    <button class="btn-filtro-fecha" data-rango="anteayer">Anteayer</button>
    <button class="btn-filtro-fecha" data-rango="semana">Semana pasada</button>
    <button class="btn-filtro-fecha" data-rango="mes">Mes pasado</button>
</div>

<!-- Filtro por rango de fechas -->
<div class="filtros-fecha-rango">
    <span class="filtro-label"><i class="fas fa-calendar-alt"></i> Rango:</span>
    <input type="date" id="fechaDesde" class="input-fecha">
    <span class="filtro-separador">hasta</span>
    <input type="date" id="fechaHasta" class="input-fecha">
    <button class="btn-filtro-fecha btn-aplicar" id="btnFiltrarRango">Aplicar</button>
    <button class="btn-filtro-fecha btn-limpiar" id="btnLimpiarFechas">Limpiar</button>
</div>

        <!-- Tabla de Citas -->
        <div class="citas-table">
            <table>
                <thead>
                    <tr>
                        <th>Paciente</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Estado</th>
                        <th>Examen</th>
                        <th>Prioridad</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="citasBody">
                    <tr>
                        <td colspan="7" class="loading-state">
                            <div class="spinner"></div>
                            <p>Cargando citas...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let citasData = [];
        let filtroFechaActual = null; // 'hoy', 'ayer', 'anteayer', 'semana', 'mes', o null

document.addEventListener('DOMContentLoaded', () => {
    cargarCitas();
    
    document.getElementById('filtroEstado').addEventListener('change', aplicarFiltros);
    document.getElementById('filtroExamen').addEventListener('change', aplicarFiltros);
    document.getElementById('filtroPrioridad').addEventListener('change', aplicarFiltros);
    document.getElementById('buscador').addEventListener('input', aplicarFiltros);
    document.getElementById('btnActualizar').addEventListener('click', cargarCitas);

    // ===== MOVER AQUÍ LOS EVENT LISTENERS DE FECHA =====
    
    // Filtros rápidos de fecha
    document.querySelectorAll('[data-rango]').forEach(btn => {
        btn.addEventListener('click', function(e) {
            const rango = this.dataset.rango;
            
            // Si ya está activo, lo desactivamos
            if (filtroFechaActual === rango) {
                filtroFechaActual = null;
                this.classList.remove('activo');
            } else {
                // Desactivar todos los botones
                document.querySelectorAll('[data-rango]').forEach(b => b.classList.remove('activo'));
                filtroFechaActual = rango;
                this.classList.add('activo');
                // Limpiar campos de rango
                document.getElementById('fechaDesde').value = '';
                document.getElementById('fechaHasta').value = '';
            }
            aplicarFiltros();
        });
    });

    // Filtrar por rango de fechas
    document.getElementById('btnFiltrarRango').addEventListener('click', function() {
        const desde = document.getElementById('fechaDesde').value;
        const hasta = document.getElementById('fechaHasta').value;
        
        if (!desde && !hasta) {
            alert('Por favor, selecciona al menos una fecha');
            return;
        }
        
        // Limpiar filtros rápidos
        document.querySelectorAll('[data-rango]').forEach(b => b.classList.remove('activo'));
        filtroFechaActual = null;
        aplicarFiltros();
    });

    // Limpiar filtros de fecha
    document.getElementById('btnLimpiarFechas').addEventListener('click', function() {
        document.getElementById('fechaDesde').value = '';
        document.getElementById('fechaHasta').value = '';
        document.querySelectorAll('[data-rango]').forEach(b => b.classList.remove('activo'));
        filtroFechaActual = null;
        aplicarFiltros();
    });
});


        async function cargarCitas() {
            try {
                const tbody = document.getElementById('citasBody');
                
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="loading-state">
                            <div class="spinner"></div>
                            <p>Cargando citas...</p>
                        </td>
                    </tr>
                `;

                console.log('Solicitando citas...');
                const response = await window.api.obtenerCitasConEstadoExamen();
                console.log('Respuesta:', response);
                
                if (!response.ok) {
                    throw new Error(response.error || 'Error desconocido');
                }

                citasData = response.citas || [];
                document.getElementById('totalCitas').textContent = citasData.length;
                document.getElementById('citasPendientes').textContent = 
                    citasData.filter(c => c.estado === 'pendiente' || c.estado === 'confirmada').length;
                
                renderizarCitas(citasData);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('citasBody').innerHTML = `
                    <tr>
                        <td colspan="7" class="error-state">
                            <i class="fas fa-exclamation-circle"></i>
                            Error al cargar citas: ${error.message}
                        </td>
                    </tr>
                `;
            }
        }

        function renderizarCitas(citas) {
            const tbody = document.getElementById('citasBody');
            
            if (!citas || citas.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <i class="fas fa-calendar-times"></i>
                            <h3>No hay citas registradas</h3>
                            <p>Comience creando una nueva cita en el sistema</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = citas.map(cita => {
                const prioridad = cita.prioridad || 'normal';
                const esPrioritaria = prioridad === 'alta';
                
                return `
                    <tr class="${esPrioritaria ? 'cita-prioritaria' : ''}">
                        <td>
                            <strong>${cita.paciente_nombre || 'Paciente'}</strong>
                        </td>
                        <td>${formatearFecha(cita.fecha_cita)}</td>
                        <td>${cita.hora_cita || '--:--'}</td>
                        <td>
                            <span class="badge ${getEstadoBadge(cita.estado)}">
                                ${cita.estado || 'pendiente'}
                            </span>
                        </td>
                        <td>
                            <span class="${cita.tiene_examen ? 'badge-examen' : 'badge-sin-examen'}">
                                ${cita.tiene_examen ? 'Con examen' : 'Sin examen'}
                            </span>
                        </td>
                        <td>
                            <span class="badge-prioridad ${prioridad === 'alta' ? 'alta' : 'normal'}">
                                ${prioridad === 'alta' ? 'Alta' : 'Normal'}
                            </span>
                        </td>
                        <td>
                            <button 
                                class="btn-accion" 
                                onclick="verExamen(${cita.id}, this)"
                                ${!cita.tiene_examen ? 'disabled' : ''}
                            >
                                ${cita.tiene_examen ? 'Ver resultados' : 'Sin examen'}
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

function aplicarFiltros() {
    const estadoFiltro = document.getElementById('filtroEstado').value;
    const examenFiltro = document.getElementById('filtroExamen').value;
    const prioridadFiltro = document.getElementById('filtroPrioridad').value;
    const busqueda = document.getElementById('buscador').value.toLowerCase().trim();
    
    // Obtener fechas del rango
    const fechaDesde = document.getElementById('fechaDesde').value;
    const fechaHasta = document.getElementById('fechaHasta').value;

    let filtradas = citasData;

    // --- FILTRO POR FECHA RÁPIDA ---
    if (filtroFechaActual) {
        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);
        const ayer = new Date(hoy);
        ayer.setDate(ayer.getDate() - 1);
        const anteayer = new Date(hoy);
        anteayer.setDate(anteayer.getDate() - 2);
        const semanaPasada = new Date(hoy);
        semanaPasada.setDate(semanaPasada.getDate() - 7);
        const mesPasado = new Date(hoy);
        mesPasado.setMonth(mesPasado.getMonth() - 1);

        filtradas = filtradas.filter(c => {
            if (!c.fecha_cita) return false;
            const fechaCita = new Date(c.fecha_cita);
            fechaCita.setHours(0, 0, 0, 0);

            switch (filtroFechaActual) {
                case 'hoy':
                    return fechaCita.getTime() === hoy.getTime();
                case 'ayer':
                    return fechaCita.getTime() === ayer.getTime();
                case 'anteayer':
                    return fechaCita.getTime() === anteayer.getTime();
                case 'semana':
                    return fechaCita >= semanaPasada && fechaCita < hoy;
                case 'mes':
                    return fechaCita >= mesPasado && fechaCita < hoy;
                default:
                    return true;
            }
        });
    }

    // --- FILTRO POR RANGO DE FECHAS (desde - hasta) ---
    if (fechaDesde || fechaHasta) {
        const desde = fechaDesde ? new Date(fechaDesde) : new Date(0);
        const hasta = fechaHasta ? new Date(fechaHasta) : new Date(8640000000000000);
        
        if (fechaDesde) desde.setHours(0, 0, 0, 0);
        if (fechaHasta) hasta.setHours(23, 59, 59, 999);
        
        filtradas = filtradas.filter(c => {
            if (!c.fecha_cita) return false;
            const fechaCita = new Date(c.fecha_cita);
            return fechaCita >= desde && fechaCita <= hasta;
        });
    }

    // --- FILTROS EXISTENTES ---
    if (estadoFiltro !== 'todos') {
        filtradas = filtradas.filter(c => c.estado === estadoFiltro);
    }

    if (examenFiltro === 'con') {
        filtradas = filtradas.filter(c => c.tiene_examen === true);
    } else if (examenFiltro === 'sin') {
        filtradas = filtradas.filter(c => c.tiene_examen === false);
    }

    if (prioridadFiltro !== 'todos') {
        filtradas = filtradas.filter(c => (c.prioridad || 'normal') === prioridadFiltro);
    }

    if (busqueda) {
        filtradas = filtradas.filter(c => 
            (c.paciente_nombre || '').toLowerCase().includes(busqueda)
        );
    }

    renderizarCitas(filtradas);
}


async function verExamen(citaId, button) {
    try {
        const textoOriginal = button.textContent;
        button.textContent = 'Cargando...';
        button.disabled = true;

        console.log('🔍 Buscando exámenes para cita ID:', citaId);
        
        // ✅ PASO 1: Primero verificar si existe examen (consulta RÁPIDA)
        const existeResponse = await window.api.verificarExamenPorCita(citaId);
        console.log('📌 Verificación rápida:', existeResponse);
        
        if (!existeResponse.ok) {
            throw new Error(existeResponse.error || 'Error al verificar');
        }
        
        if (!existeResponse.existe) {
            alert('❌ Esta cita no tiene exámenes asociados.');
            button.textContent = textoOriginal;
            button.disabled = false;
            return;
        }
        
        // ✅ PASO 2: Ahora sí, obtener los datos completos (solo si existe)
        console.log('📥 Cargando datos completos del examen...');
        const response = await window.api.obtenerCitaConExamen(citaId);
        console.log('📥 Respuesta completa:', response);
        
        if (!response.ok) {
            throw new Error(response.error || 'Error al obtener examen');
        }

        const cita = response.cita;
        
        if (!cita) {
            alert('❌ No se encontró la cita.');
            return;
        }

        const tieneExamen = cita.examenes && (cita.examenes.audiometria || cita.examenes.logoaudiometria);
        
        if (!tieneExamen) {
            alert('❌ Esta cita no tiene exámenes asociados.');
            return;
        }

        // ✅ PASO 3: Abrir ventana con los datos
        window.api.abrirVentanaDetalles({ cita: cita });

        button.textContent = textoOriginal;
        button.disabled = false;

    } catch (error) {
        console.error('❌ Error:', error);
        alert(`Error: ${error.message}`);
        if (button) {
            button.textContent = 'Ver resultados';
            button.disabled = false;
        }
    }
}

        function formatearFecha(fecha) {
            if (!fecha) return 'Fecha no disponible';
            try {
                const date = new Date(fecha);
                return date.toLocaleDateString('es-ES', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            } catch {
                return fecha;
            }
        }

        function getEstadoBadge(estado) {
            const estados = {
                'pendiente': 'badge-warning',
                'confirmada': 'badge-info',
                'atendida': 'badge-success',
                'cancelada': 'badge-danger'
            };
            return estados[estado] || 'badge-warning';
        }
