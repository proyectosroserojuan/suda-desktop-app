<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor PDF</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .toolbar {
            background: #1e3a8a;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .toolbar h2 {
            font-size: 16px;
            margin: 0;
        }
        .toolbar-buttons {
            display: flex;
            gap: 10px;
        }
        .toolbar button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-imprimir {
            background: #27ae60;
            color: white;
        }
        .btn-imprimir:hover { background: #219a52; }
        .btn-cerrar {
            background: #e74c3c;
            color: white;
        }
        .btn-cerrar:hover { background: #c0392b; }
        #pdfContainer {
            flex: 1;
            width: 100%;
            min-height: 0;
            background: white;
        }
        #pdfContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 18px;
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1e3a8a;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: #e74c3c;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <h2>📄 Documento PDF</h2>
        <div class="toolbar-buttons">
            <button class="btn-imprimir" onclick="imprimirPDF()">🖨️ Imprimir</button>
            <button class="btn-cerrar" onclick="cerrarVentana()">✕ Cerrar</button>
        </div>
    </div>
    <div id="pdfContainer">
        <div class="loading">
            <div class="spinner"></div>
            <span>Cargando PDF...</span>
        </div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');

        function cargarPDF(ruta) {
            const container = document.getElementById('pdfContainer');
            
            // Verificar que la ruta existe
            const fs = require('fs');
            if (!fs.existsSync(ruta)) {
                container.innerHTML = `<div class="error-message">❌ Error: El archivo PDF no existe:<br>${ruta}</div>`;
                return;
            }

            // Crear iframe para mostrar el PDF
            const iframe = document.createElement('iframe');
            iframe.src = 'file://' + ruta;
            iframe.onload = function() {
                // Ocultar el loading
                container.innerHTML = '';
                container.appendChild(iframe);
            };
            iframe.onerror = function() {
                container.innerHTML = `<div class="error-message">❌ Error al cargar el PDF</div>`;
            };
            
            // Mostrar el iframe
            container.innerHTML = '';
            container.appendChild(iframe);
        }

        function imprimirPDF() {
            const iframe = document.querySelector('#pdfContainer iframe');
            if (iframe) {
                iframe.contentWindow.print();
            }
        }

        function cerrarVentana() {
            const { ipcRenderer } = require('electron');
            ipcRenderer.send('cerrar-visor-pdf');
        }

        // Escuchar el evento para cargar el PDF
        ipcRenderer.on('cargar-pdf', (event, ruta) => {
            cargarPDF(ruta);
        });

        // Si no se recibe evento en 5 segundos, cerrar
        setTimeout(() => {
            const container = document.getElementById('pdfContainer');
            if (container.querySelector('.loading')) {
                container.innerHTML = '<div class="error-message">⏱️ Tiempo de espera agotado. El PDF no se pudo cargar.</div>';
            }
        }, 10000);
    </script>
</body>
</html>
